  const secs={};
  SECTION_DEFS.forEach(sd=>{
    const j=jsonData.sections?.[sd.id];
    secs[sd.id]={tableColumns:j?.tableColumns||[],tableRows:j?.tableRows||[],
      recommendation:getSmartRec(sd.id,j,flagsList,cpuUtils),chartImage:null,screenshots:[],
      inputMode:sd.id==='cpu'?(cpuUtils.rows?.length?'chart':'image'):null};
  });
  const flagsList=jsonData.flags||[];
  return{
    folderName:jsonData.folderName||di.instanceName||m.instance||'Snapshot',
    files:{},
    parsed:{
      status:{dbName:di.databaseName||m.database||'',dbRole:m.dbRole||'',
        openMode:di.openMode||m.openMode||'',protectionMode:'',
        isStandby:(m.dbRole||'').includes('STANDBY'),isMrpHealthy:false},
      hostname:{hostname:si.hostname||m.host||'',osName:si.os||''},
      cpuUtils,
      cpuInfo:{cpuCount:parseInt(si.cpus)||0,cpuModel:si.systemModel||''},
      memory:{totalGb:si.totalMemory?parseFloat(si.totalMemory):0},
      tablespace:{rows:[]},mountpoint:{rows:[]},rman:{rows:[]},
      sessions:{rows:[]},asm:{groups:[]},
      serverInfo:si,
      databaseInfo:di,
    },
    flags:flagsList,
    sections:secs,
    exaSummaryIssues:flagsList.map(flag=>({section:flag.section,problem:flag.message,recommendation:'',risk:'Medium',impact:flag.severity==='critical'?'High':'Medium',comment:''})),
  };
}

// Build report data object from db state
function buildReportData(db,meta){
  const execIssues=(db.exaSummaryIssues||[]).filter(i=>i.section||i.problem);
  return{
    period:meta.period,dataCollectionDate:meta.dataCollectionDate,
    docVersion:meta.docVersion,docDate:meta.docDate,authorName:meta.authorName,
    overallCondition:meta.overallCondition,summaryText:meta.summaryText||'',
    executiveSummaryIssues:execIssues.length>0?execIssues:[{section:'',problem:'',recommendation:'',risk:'',impact:'Low',comment:''}],
    sections:(meta.sectionsConfig||defaultSectionsConfig).filter(sc=>sc.enabled).map(sc=>{
      const sec=db.sections[sc.id]||{};
      return{id:sc.id,name:sc.name,contentType:sc.contentType||'table',
        recommendation:sec.recommendation||sc.defaultRec,
        customNotes:'',screenshots:sec.screenshots||[],
        tableColumns:sec.tableColumns||[],tableRows:sec.tableRows||[],
        chartImage:sec.chartImage||null,inputMode:sec.inputMode||null};
    }),
  };
}

// ─── PARSED DATA TABLE ───────────────────────────────────────────────────────
function ParsedDataTable({columns,rows,flaggedRows,flaggedCol}){
  if(!rows||!rows.length)return(<div style={{textAlign:'center',padding:24,color:'#7a8f9e',fontSize:13}}>No data available for this section.</div>);
  return(
    <div style={{overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
        <thead><tr>{columns.map((col,i)=>(
          <th key={i} style={{background:'#0f4c75',color:'#fff',padding:'7px 10px',textAlign:'left',fontWeight:700,whiteSpace:'nowrap',fontSize:11}}>{col}</th>
        ))}</tr></thead>
        <tbody>{rows.map((row,ri)=>(
          <tr key={ri} style={{background:flaggedRows?.[ri]?'#fff5f5':(ri%2===0?'#fff':'#f9fbfc')}}>
            {(row||[]).map((cell,ci)=>(
              <td key={ci} style={{padding:'6px 10px',border:'1px solid #edf1f5',fontSize:12,
                color:(flaggedRows?.[ri]&&ci===flaggedCol)?'#e53e3e':'#1a2b3c',
                fontWeight:(flaggedRows?.[ri]&&ci===flaggedCol)?700:400,
                whiteSpace:ci===0||ci===columns.length-1?'nowrap':'normal'}}>
                {cell??''}
              </td>
            ))}
          </tr>
        ))}</tbody>
      </table>
    </div>
  );
}

// ─── DB SUMMARY TAB ──────────────────────────────────────────────────────────
function DbSummaryTab({db}){
  const p=db.parsed;
  const items=[
    ['Hostname',p.hostname?.hostname],['Database Name',p.status?.dbName],
    ['Database Role',p.status?.dbRole],['Open Mode',p.status?.openMode],
    ['Operating System',p.hostname?.osName],
    ['CPU',p.cpuInfo?.cpuCount?(p.cpuInfo.cpuCount+' vCPUs — '+p.cpuInfo.cpuModel):null],
    ['Memory (Total)',p.memory?.totalGb?(p.memory.totalGb.toFixed(0)+' GB'):null],
    ['Protection Mode',p.status?.protectionMode],
    ['MRP0 Status',p.status?.isStandby?(p.status.mrpStatus||'Unknown'):null],
  ].filter(([,v])=>v);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px 24px',marginBottom:24,padding:'16px',background:'#f7fafc',borderRadius:10}}>
        {items.map(([k,v])=>(
          <div key={k} style={{display:'flex',gap:8,alignItems:'baseline'}}>
            <span style={{color:'#7a8f9e',fontSize:12,minWidth:110,flexShrink:0}}>{k}</span>
            <span style={{fontSize:13,fontWeight:600,color:'#0f2b3d'}}>{v}</span>
          </div>
        ))}
      </div>
      {db.flags.length>0&&(
        <div>
          <div style={{fontSize:12,fontWeight:700,color:'#0f2b3d',marginBottom:10,textTransform:'uppercase',letterSpacing:'0.05em'}}>Detected Issues</div>
          {db.flags.map((flag,i)=>(
            <div key={i} style={{display:'flex',gap:12,padding:'10px 14px',borderRadius:8,marginBottom:6,
              background:flag.severity==='critical'?'#fff5f5':'#fffbeb',
              border:`1px solid ${flag.severity==='critical'?'#fed7d7':'#fef08a'}`}}>
              <span style={{fontSize:16}}>{flag.severity==='critical'?'🔴':'⚠️'}</span>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:flag.severity==='critical'?'#c53030':'#92400e'}}>{flag.section} — {flag.item}</div>
                <div style={{fontSize:12,color:'#7a8f9e',marginTop:2}}>{flag.message}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      {db.flags.length===0&&(<div style={{textAlign:'center',padding:20,color:'#16a34a',fontWeight:600,fontSize:14}}>✓ No threshold violations detected</div>)}
    </div>
  );
}

// ─── STEP 0: LOAD DATA ───────────────────────────────────────────────────────
function StepLoad({onLoad,logoData,setLogoData,clientLogoData,setClientLogoData,backendStatus,setMeta}){
  const[loading,setLoading]=useState(false);
  const[progress,setProgress]=useState([]);
  const[error,setError]=useState(null);
  const[snapshotCount,setSnapshotCount]=useState(0);
  const[folderPath,setFolderPath]=useState('');
  const[validation,setValidation]=useState(null);
  const[validating,setValidating]=useState(false);
  const[extracting,setExtracting]=useState(false);
  const[validateError,setValidateError]=useState(null);
  const[extractError,setExtractError]=useState(null);
  const[tmplList,setTmplList]=useState(()=>sto.getTemplates());
  const[selTmplId,setSelTmplId]=useState('');
  const[tmplLoaded,setTmplLoaded]=useState(false);
  const[subfolders,setSubfolders]=useState([]);
  const[checkedSubs,setCheckedSubs]=useState(new Set());
  const[extractProgress,setExtractProgress]=useState([]);
  const handleValidate=async()=>{
    if(!folderPath.trim())return;
    setValidating(true);setValidation(null);setValidateError(null);setExtractError(null);setSubfolders([]);setCheckedSubs(new Set());setExtractProgress([]);
    try{
      const res=await fetch('http://localhost:8000/validate',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({path:folderPath.trim()})});
      const v=await res.json();
      setValidation(v);
      if(v.type==='multi'){setSubfolders(v.subfolders||[]);setCheckedSubs(new Set((v.subfolders||[]).map(s=>s.path)));}
    }catch(e){setValidateError('Cannot reach backend. Is "uvicorn server:app --reload" running?');}
    finally{setValidating(false);}
  };

  const handleExtract=async()=>{
    if(!folderPath.trim())return;
    // Multi-folder extract
    if(validation?.type==='multi'){
      const selected=subfolders.filter(s=>checkedSubs.has(s.path));
      if(!selected.length)return;
      setExtracting(true);setExtractProgress([]);setExtractError(null);
      const results=[];
      for(const sub of selected){
        setExtractProgress(p=>[...p,`⚙ Extracting ${sub.name}...`]);
        const t0=Date.now();
        try{
          const res=await fetch('http://localhost:8000/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:sub.path})});
          const data=await res.json();
          if(!data.error){results.push(loadSnapshotJson(data));setExtractProgress(p=>[...p.slice(0,-1),`✓ ${sub.name} (${((Date.now()-t0)/1000).toFixed(1)}s)`]);}
          else{setExtractProgress(p=>[...p.slice(0,-1),`✗ ${sub.name}: ${data.error}`]);}
        }catch{setExtractProgress(p=>[...p.slice(0,-1),`✗ ${sub.name}: connection error`]);}
      }
      setExtracting(false);
      if(results.length)setTimeout(()=>onLoad(results),600);
      return;
    }
    // Single-folder extract
    setExtracting(true);setExtractError(null);
    try{
      const res=await fetch('http://localhost:8000/extract',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({path:folderPath.trim()})});
      const data=await res.json();
      if(data.error){setExtractError(data.error);return;}
      onLoad([loadSnapshotJson(data)]);
    }catch(e){setExtractError('Cannot reach backend. Is "uvicorn server:app --reload" running?');}
    finally{setExtracting(false);}
  };

  const handleSnapshotJson=async(e)=>{
    const files=Array.from(e.target.files);
    if(!files.length)return;
    setError(null);
    const loaded=[];
    for(const file of files){
      try{
        const text=await file.text();
        loaded.push(loadSnapshotJson(JSON.parse(text)));
      }catch(err){setError('Invalid snapshot JSON: '+file.name+' — '+err.message);return;}
    }
    if(loaded.length){setSnapshotCount(loaded.length);setTimeout(()=>onLoad(loaded),400);}
  };
  const addLog=msg=>setProgress(p=>[...p,msg]);
  const handleLogoUpload=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{const bytes=new Uint8Array(ev.target.result);const type=file.type==='image/png'?'png':'jpg';setLogoData({data:bytes,type,name:file.name})};
    reader.readAsArrayBuffer(file);
  };
  const handleClientLogoUpload=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{const bytes=new Uint8Array(ev.target.result);const type=file.type==='image/png'?'png':'jpg';setClientLogoData({data:bytes,type,name:file.name})};
    reader.readAsArrayBuffer(file);
  };

  const handleBrowse=async()=>{
    try{
      const res=await fetch('http://localhost:8000/browse-folder');
      const data=await res.json();
      if(data.path)setFolderPath(data.path);
    }catch{}
  };

  const canExtract=validation&&(validation.type==='multi'?checkedSubs.size>0:!!validation.status);
  const valStatusColor=!validation?'#7a8f9e':validation.status==='ok'?'#16a34a':validation.status==='warning'?'#d97706':'#b91c1c';
  const valStatusBg=!validation?'#f7fafc':validation.status==='ok'?'#f0fdf4':validation.status==='warning'?'#fffbeb':'#fff5f5';

  return(
    <div style={{maxWidth:520,margin:'0 auto',paddingTop:32}}>
      <div style={{marginBottom:40,animation:'fadeUp 0.5s ease both'}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1b9aaa',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:10}}>Step 1 of 4</div>
        <h1 style={{fontSize:34,fontWeight:900,color:'#0f2b3d',letterSpacing:'-0.03em',marginBottom:10,lineHeight:1.1}}>Load Database Files</h1>
        <p style={{color:'#5a7184',fontSize:14,lineHeight:1.7}}>
          Select the host folder (e.g. <code style={{background:'#e8f0f8',padding:'2px 6px',borderRadius:4,fontSize:12}}>exakai04db01</code>) or a single database subfolder. All diagnostic .txt files will be parsed automatically.
        </p>
      </div>

      {/* ── Saved Templates ─────────────────────────────────────────────── */}
      {tmplList.length>0&&(
        <div style={{marginBottom:16,padding:'16px',background:'#fff',borderRadius:12,border:'1px solid #e2eaf0',animation:'fadeUp 0.4s ease both'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#0f2b3d',marginBottom:10}}>Saved Templates</div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <select value={selTmplId} onChange={e=>setSelTmplId(e.target.value)} style={{...S.inp,flex:1,padding:'7px 10px',fontSize:13}}>
              <option value="">— Select template —</option>
              {tmplList.map(t=><option key={t.id} value={t.id}>{t.name} ({t.savedAt})</option>)}
            </select>
            <button disabled={!selTmplId} onClick={()=>{const t=tmplList.find(x=>x.id===selTmplId);if(t){setMeta(t.meta);setTmplLoaded(true);setTimeout(()=>setTmplLoaded(false),2000)}}}
              style={{...S.pb,padding:'7px 16px',fontSize:13,opacity:selTmplId?1:0.5}}>Load</button>
            <button disabled={!selTmplId} onClick={()=>{sto.deleteTemplate(selTmplId);setTmplList(sto.getTemplates());setSelTmplId('')}}
              style={{padding:'7px 12px',borderRadius:8,border:'1px solid #fca5a5',background:'#fff5f5',color:'#b91c1c',cursor:'pointer',fontSize:13,fontWeight:700,opacity:selTmplId?1:0.5}}>×</button>
          </div>
          {tmplLoaded&&<div style={{marginTop:8,fontSize:12,color:'#16a34a',fontWeight:600}}>✓ Template loaded — edit in Step 3</div>}
        </div>
      )}

      {/* ── Backend Path Input (Method A) ─────────────────────────────── */}
      <div style={{marginBottom:16,padding:'18px',background:'#fff',borderRadius:12,border:'1px solid #e2eaf0',animation:'fadeUp 0.45s ease both'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:'#0f2b3d'}}>Load via Backend API</div>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:700,
            color:backendStatus==='ok'?'#16a34a':backendStatus==='offline'?'#b91c1c':'#d97706'}}>
            <div style={{width:7,height:7,borderRadius:'50%',background:backendStatus==='ok'?'#16a34a':backendStatus==='offline'?'#b91c1c':'#d97706',
              animation:backendStatus==='checking'?'pulse 1.2s infinite':undefined}}/>
            {backendStatus==='ok'?'Backend online':backendStatus==='offline'?'Backend offline':'Checking...'}
          </div>
        </div>
        {backendStatus==='offline'&&(
          <div style={{background:'#fef9c3',border:'1px solid #f6e05e',borderRadius:8,padding:'10px 12px',marginBottom:10,fontSize:12,color:'#854d0e'}}>
            Start backend: <code style={{background:'rgba(0,0,0,0.06)',padding:'1px 5px',borderRadius:3}}>uvicorn server:app --reload</code>
          </div>
        )}
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <input value={folderPath} onChange={e=>setFolderPath(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')handleValidate();}}
            placeholder="e.g. D:\Database Data\exakai04db01\MBSHIP1"
            style={{...S.inp,flex:1,fontSize:12}} disabled={backendStatus!=='ok'}/>
          <button onClick={handleBrowse} disabled={backendStatus!=='ok'}
            style={{padding:'9px 14px',borderRadius:8,border:'1px solid #d0dce4',background:'#f7fafc',color:'#0f2b3d',fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',opacity:backendStatus!=='ok'?0.5:1}}>
            Browse…
          </button>
          <button onClick={handleValidate} disabled={!folderPath.trim()||validating||backendStatus!=='ok'}
            style={{...S.pb,padding:'9px 14px',fontSize:12,opacity:(!folderPath.trim()||backendStatus!=='ok')?0.5:1,whiteSpace:'nowrap'}}>
            {validating?'Checking…':'Validate'}
          </button>
        </div>
        {validateError&&<div style={{fontSize:12,color:'#b91c1c',marginBottom:8}}>{validateError}</div>}

        {/* Validity Panel */}
        {validation&&validation.type==='multi'?(
          <div style={{marginTop:4,padding:'12px 14px',background:'#f0fafb',borderRadius:9,border:'1px solid #b0d4e833'}}>
            <div style={{fontSize:13,fontWeight:700,color:'#0f4c75',marginBottom:10}}>
              Found {subfolders.length} database folder{subfolders.length!==1?'s':''} — select to extract:
            </div>
            {subfolders.map(s=>(
              <div key={s.path} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                <input type="checkbox" checked={checkedSubs.has(s.path)}
                  onChange={e=>{const ns=new Set(checkedSubs);e.target.checked?ns.add(s.path):ns.delete(s.path);setCheckedSubs(ns)}}
                  style={{accentColor:'#1b9aaa'}}/>
                <span style={{fontSize:13,fontWeight:600,color:'#0f2b3d'}}>{s.name}</span>
                <span style={{fontSize:11,color:s.status==='ok'?'#16a34a':s.status==='warning'?'#d97706':'#b91c1c',fontWeight:600}}>
                  {s.status==='ok'?'✅ Ready':s.status==='warning'?'⚠ Warning':'❌ Error'}
                </span>
              </div>
            ))}
            <div style={{display:'flex',gap:8,marginTop:8,marginBottom:10}}>
              <button onClick={()=>setCheckedSubs(new Set(subfolders.map(s=>s.path)))} style={{fontSize:11,color:'#1b9aaa',background:'none',border:'1px solid #b0d4e8',borderRadius:6,padding:'3px 10px',cursor:'pointer'}}>Select All</button>
              <button onClick={()=>setCheckedSubs(new Set())} style={{fontSize:11,color:'#5a7184',background:'none',border:'1px solid #d0dce4',borderRadius:6,padding:'3px 10px',cursor:'pointer'}}>Deselect All</button>
            </div>
            <button onClick={handleExtract} disabled={checkedSubs.size===0||extracting}
              style={{...S.pb,padding:'9px 18px',fontSize:13,opacity:(checkedSubs.size===0||extracting)?0.5:1}}>
              {extracting?'Extracting…':`⚡ Extract Selected (${checkedSubs.size})`}
            </button>
            {extractProgress.length>0&&(
              <div style={{marginTop:10,fontFamily:'monospace',fontSize:12,color:'#5a7184',lineHeight:1.8}}>
                {extractProgress.map((msg,i)=><div key={i}>{msg}</div>)}
              </div>
            )}
            {extractError&&<div style={{fontSize:12,color:'#b91c1c',marginTop:8}}>{extractError}</div>}
          </div>
        ):validation&&(
          <div style={{marginTop:4,padding:'12px 14px',background:valStatusBg,borderRadius:9,border:`1px solid ${valStatusColor}33`}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <span style={{fontSize:13,fontWeight:700,color:valStatusColor}}>
                {validation.status==='ok'?'✓ All checks passed':validation.status==='warning'?'⚠ Warnings (can still load)':'✗ Errors found'}
              </span>
            </div>
            {[{title:'Files',items:(validation.files||[]).map(f=>({name:f.name,found:f.found,sev:f.severity}))},
              {title:'HTML Anchors',items:(validation.tables||[]).map(t=>({name:t.anchor,found:t.found,sev:t.severity}))}]
              .filter(g=>g.items.length>0).map(group=>(
              <div key={group.title} style={{marginBottom:8}}>
                <div style={{fontSize:10,fontWeight:700,color:'#5a7184',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:4}}>{group.title}</div>
                {group.items.map((item,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:7,fontSize:11,padding:'2px 0'}}>
                    <span style={{fontSize:13,lineHeight:1}}>{item.found?'✅':item.sev==='error'?'❌':'⚠️'}</span>
                    <span style={{color:!item.found&&item.sev==='error'?'#b91c1c':!item.found&&item.sev==='warning'?'#d97706':'#1a2b3c'}}>
                      {item.name}
                    </span>
                  </div>
                ))}
              </div>
            ))}
            <button onClick={handleExtract} disabled={!canExtract||extracting}
              style={{...S.pb,marginTop:8,padding:'9px 18px',fontSize:13,opacity:(!canExtract||extracting)?0.5:1}}>
              {extracting?<><span style={{display:'inline-block',width:12,height:12,border:'2px solid rgba(255,255,255,0.4)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin 0.7s linear infinite',marginRight:6}}/>Extracting…</>:'⚡ Extract & Load'}
            </button>
            {validation.status==='warning'&&!canExtract===false&&(
              <div style={{fontSize:11,color:'#d97706',marginTop:6}}>Some optional files are missing but extraction can proceed.</div>
            )}
            {extractError&&<div style={{fontSize:12,color:'#b91c1c',marginTop:8}}>{extractError}</div>}
          </div>
        )}
      </div>

      {error&&(<div style={{background:'#fff5f5',border:'1px solid #fca5a5',borderRadius:10,padding:'14px 18px',marginBottom:12,color:'#b91c1c',fontSize:13}}>{error}</div>)}
      {loading?(
        <div style={{...S.card,padding:28}}>
          <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:20}}>
            {[0,1,2].map(i=><div key={i} style={{width:9,height:9,borderRadius:'50%',background:'#1b9aaa',animation:`pulse 1.2s ${i*0.22}s infinite`}}/>)}
          </div>
          <div style={{fontFamily:'monospace',fontSize:12,color:'#5a7184',maxHeight:220,overflowY:'auto',lineHeight:1.8}}>
            {progress.map((msg,i)=><div key={i} style={{animation:`fadeUp 0.3s ease both`,animationDelay:`${i*0.08}s`}}>{msg}</div>)}
          </div>
        </div>
      ):(
        <div>
          <div style={{marginTop:16,padding:'16px',background:'#fff',borderRadius:12,border:'1px solid #e2eaf0'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#0f2b3d',marginBottom:10}}>Logos <span style={{fontWeight:400,color:'#7a8f9e'}}>(optional)</span></div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              <div>
                <div style={{fontSize:11,color:'#5a7184',marginBottom:5}}>Company Logo <span style={{color:'#a0b4c0'}}>(cover & header)</span></div>
                <label style={{display:'inline-flex',alignItems:'center',gap:8,cursor:'pointer',padding:'9px 16px',borderRadius:8,border:'1px dashed #b0c4d0',fontSize:13,color:'#1b9aaa',fontWeight:600,background:'#f7fafc'}}>
                  🖼 Upload
                  <input type="file" accept="image/png,image/jpeg" onChange={handleLogoUpload} style={{display:'none'}}/>
                </label>
                {logoData&&<div style={{marginTop:5,fontSize:11,color:'#16a34a',fontWeight:600}}>✓ {logoData.name}</div>}
              </div>
              <div>
                <div style={{fontSize:11,color:'#5a7184',marginBottom:5}}>Client Logo <span style={{color:'#a0b4c0'}}>(cover page)</span></div>
                <label style={{display:'inline-flex',alignItems:'center',gap:8,cursor:'pointer',padding:'9px 16px',borderRadius:8,border:'1px dashed #b0c4d0',fontSize:13,color:'#1b9aaa',fontWeight:600,background:'#f7fafc'}}>
                  🖼 Upload
                  <input type="file" accept="image/png,image/jpeg" onChange={handleClientLogoUpload} style={{display:'none'}}/>
                </label>
                {clientLogoData&&<div style={{marginTop:5,fontSize:11,color:'#16a34a',fontWeight:600}}>✓ {clientLogoData.name}</div>}
              </div>
            </div>
          </div>
          <div style={{marginTop:12,padding:'16px',background:'#fff',borderRadius:12,border:'1px solid #e2eaf0'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#0f2b3d',marginBottom:8}}>
              Load from Snapshot JSON
              <span style={{fontWeight:400,color:'#7a8f9e',marginLeft:6}}>(generated by extract_snapshot.py)</span>
            </div>
            <label style={{display:'inline-flex',alignItems:'center',gap:8,cursor:'pointer',padding:'9px 16px',borderRadius:8,border:'1px dashed #b0c4d0',fontSize:13,color:'#1b9aaa',fontWeight:600,background:'#f7fafc'}}>
              📊 Load Snapshot JSON
              <input type="file" accept=".json" multiple onChange={handleSnapshotJson} style={{display:'none'}}/>
            </label>
            {snapshotCount>0&&<div style={{marginTop:8,fontSize:12,color:'#16a34a',fontWeight:600}}>✓ {snapshotCount} snapshot(s) loaded</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── STEP 1: REVIEW ──────────────────────────────────────────────────────────
function StepReview({databases,onNext}){
  const[expanded,setExpanded]=useState({[databases[0]?.folderName]:true});
  const[activeTab,setActiveTab]=useState({});
  const tog=id=>setExpanded(p=>({...p,[id]:!p[id]}));
  const getTab=id=>activeTab[id]||'summary';
  const setTab=(id,tab)=>setActiveTab(p=>({...p,[id]:tab}));
  const totalFlags=databases.reduce((s,db)=>s+db.flags.length,0);
  const TABS=['summary','sysinfo','tablespace','mountpoints','rman','sessions','cpu'];
  return(
    <div>
      <div style={{marginBottom:28,animation:'fadeUp 0.4s ease both'}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1b9aaa',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:8}}>Step 2 of 4</div>
        <h1 style={{fontSize:34,fontWeight:900,color:'#0f2b3d',letterSpacing:'-0.03em',marginBottom:6,lineHeight:1.1}}>Data Review</h1>
        <p style={{color:'#5a7184',fontSize:14}}>
          {databases.length} database{databases.length!==1?'s':''} loaded &nbsp;·&nbsp;
          <span style={{color:totalFlags>0?'#e53e3e':'#16a34a',fontWeight:700}}>
            {totalFlags>0?`${totalFlags} issue${totalFlags!==1?'s':''} flagged`:'✓ No issues detected'}
          </span>
        </p>
      </div>
      {databases.map((db,idx)=>{
        const crit=db.flags.filter(f=>f.severity==='critical').length;
        const warn=db.flags.filter(f=>f.severity==='warning').length;
        const isOpen=expanded[db.folderName];
        return(
          <div key={db.folderName} style={{...S.card,marginBottom:12,padding:0,overflow:'hidden',animation:`fadeUp 0.35s ease both`,animationDelay:`${idx*0.06}s`}}>
            <div onClick={()=>tog(db.folderName)} style={{display:'flex',alignItems:'center',gap:14,padding:'18px 22px',cursor:'pointer',background:isOpen?'#f7fafc':'#fff'}}>
              <div style={{width:42,height:42,borderRadius:11,background:'linear-gradient(135deg,#0f4c75,#1b9aaa)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <span style={{color:'#fff',fontWeight:900,fontSize:15}}>{db.folderName[0].toUpperCase()}</span>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:15,color:'#0f2b3d'}}>{db.folderName}</div>
                <div style={{fontSize:12,color:'#7a8f9e'}}>{db.parsed.hostname?.hostname||''}{db.parsed.hostname?.osName?' · '+db.parsed.hostname.osName:''}</div>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                {crit>0&&<span style={{...S.tag,background:'#fff5f5',color:'#e53e3e'}}>🔴 {crit} critical</span>}
                {warn>0&&<span style={{...S.tag,background:'#fffbeb',color:'#d97706'}}>⚠ {warn} warning{warn!==1?'s':''}</span>}
                {db.flags.length===0&&<span style={{...S.tag,background:'#f0fdf4',color:'#16a34a'}}>✓ OK</span>}
                <span style={{color:'#a0b4c0',fontSize:11,marginLeft:4}}>{isOpen?'▲':'▼'}</span>
              </div>
            </div>
            {isOpen&&(
              <div>
                <div style={{display:'flex',borderBottom:'2px solid #f0f4f8',padding:'0 22px',gap:0,overflowX:'auto'}}>
                  {TABS.map(tab=>(
                    <button key={tab} onClick={()=>setTab(db.folderName,tab)} style={{background:'none',border:'none',padding:'10px 14px',cursor:'pointer',fontSize:12,fontWeight:600,whiteSpace:'nowrap',color:getTab(db.folderName)===tab?'#0f4c75':'#7a8f9e',borderBottom:getTab(db.folderName)===tab?'2px solid #1b9aaa':'2px solid transparent',marginBottom:-2}}>
                      {tab.charAt(0).toUpperCase()+tab.slice(1)}
                    </button>
                  ))}
                </div>
                <div style={{padding:'20px 22px'}}>
                  {getTab(db.folderName)==='summary'&&<DbSummaryTab db={db}/>}
                  {getTab(db.folderName)==='sysinfo'&&(()=>{
                    const si=db.parsed.serverInfo||{};const di=db.parsed.databaseInfo||{};
                    const hasSi=Object.values(si).some(v=>v);const hasDi=Object.values(di).some(v=>v);
                    const InfoTable=({title,rows})=>(
                      <div style={{marginBottom:16}}>
                        <div style={{fontWeight:700,fontSize:13,color:'#0f2b3d',marginBottom:6,paddingBottom:4,borderBottom:'1px solid #e2eaf0'}}>{title}</div>
                        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                          <tbody>{rows.filter(([,v])=>v).map(([k,v])=>(
                            <tr key={k}>
                              <td style={{padding:'5px 10px',border:'1px solid #edf1f5',fontWeight:600,color:'#5a7184',width:'36%',background:'#f7fafc',whiteSpace:'nowrap'}}>{k}</td>
                              <td style={{padding:'5px 10px',border:'1px solid #edf1f5',wordBreak:'break-all'}}>{v}</td>
                            </tr>
                          ))}</tbody>
                        </table>
                      </div>
                    );
                    if(!hasSi&&!hasDi)return(
                      <div style={{textAlign:'center',padding:24,color:'#7a8f9e',fontSize:13}}>
                        No system info available. Use the backend API (path input) to extract full server & database info.
                      </div>
                    );
                    return(
                      <div>
                        {hasSi&&<InfoTable title="Server" rows={[
                          ['Hostname',si.hostname],['IP Address',si.ip],['Domain',si.domainName],
                          ['Operating System',si.os],['Kernel',si.kernel],['Virtualization',si.virtualization],
                          ['CPU(s)',si.cpus],['CPU Model',si.systemModel],['Vendor',si.vendorProcessor],
                          ['Total Memory',si.totalMemory],
                        ]}/>}
                        {hasDi&&<InfoTable title="Database" rows={[
                          ['Instance Name',di.instanceName],['Instance Status',di.instanceStatus],
                          ['Startup Time',di.instanceStartupTime],['Oracle Version',di.instanceVersion],
                          ['Database Name',di.databaseName],['DB Unique Name',di.dbUniqueName],
                          ['Created',di.databaseCreated],['Open Mode',di.openMode],
                          ['Archive Mode',di.archiveMode],['Character Set',di.characterSet],
                          ['Compatibility',di.compatibility],['SPFILE',di.spfile],
                        ]}/>}
                      </div>
                    );
                  })()}
                  {getTab(db.folderName)==='tablespace'&&<ParsedDataTable
                    columns={['Tablespace','Curr Size (MB)','Used (MB)','Used %','Free (MB)']}
                    rows={(db.parsed.tablespace?.rows||[]).map(r=>[r.tablespaceName,r.currTsSize?.toFixed(0),r.usedTsSize?.toFixed(0),r.tsPctUsed?.toFixed(2)+'%',r.freeTsSize?.toFixed(0)])}
                    flaggedRows={(db.parsed.tablespace?.rows||[]).map(r=>r.flagged)} flaggedCol={3}/>}
                  {getTab(db.folderName)==='mountpoints'&&<ParsedDataTable
                    columns={['Filesystem','Size','Used','Available','Use%','Mounted On']}
                    rows={(db.parsed.mountpoint?.rows||[]).map(r=>[r.filesystem,r.size,r.used,r.avail,r.pct+'%',r.mountOn])}
                    flaggedRows={(db.parsed.mountpoint?.rows||[]).map(r=>r.flagged)} flaggedCol={4}/>}
                  {getTab(db.folderName)==='rman'&&<ParsedDataTable
                    columns={['Type','Status','Start Time','Duration','Input (GB)','Output (GB)']}
                    rows={(db.parsed.rman?.rows||[]).map(r=>[r.inputType,r.status,r.startTime,r.timeTaken,r.inputSizeGb?.toFixed(1),r.outputSizeGb?.toFixed(1)])}
                    flaggedRows={(db.parsed.rman?.rows||[]).map(r=>r.flagged)} flaggedCol={1}/>}
                  {getTab(db.folderName)==='sessions'&&<ParsedDataTable
                    columns={['Instance','Begin Time','Current','Max','Used %']}
                    rows={(db.parsed.sessions?.rows||[]).slice(0,40).map(r=>['Inst '+r.instanceNum,r.beginTime,r.current?.toFixed(0),r.max?.toFixed(0),(r.ratio*100).toFixed(1)+'%'])}
                    flaggedRows={(db.parsed.sessions?.rows||[]).slice(0,40).map(r=>r.flagged)} flaggedCol={4}/>}
                  {getTab(db.folderName)==='cpu'&&db.parsed.cpuUtils?.rows?.length>0&&(
                    <CpuChart columns={db.parsed.cpuUtils.columns} rows={db.parsed.cpuUtils.rows.slice(0,200)} onCanvasReady={()=>{}}/>
                  )}
                  {getTab(db.folderName)==='cpu'&&!db.parsed.cpuUtils?.rows?.length&&(
                    <div style={{textAlign:'center',padding:24,color:'#7a8f9e',fontSize:13}}>No CPU data available (cpu_utils.txt not found).</div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}
      <div style={{marginTop:28,display:'flex',justifyContent:'flex-end'}}>
        <button onClick={onNext} style={{...S.pb,padding:'13px 30px',fontSize:14}}>Continue to Edit →</button>
      </div>
    </div>
  );
}

// ─── STEP 2: EDIT ────────────────────────────────────────────────────────────
function StepEdit({databases,meta,setMeta,setDatabases,onNext}){
  const[activeDb,setActiveDb]=useState(databases[0]?.folderName||'');
  const[expanded,setExpanded]=useState({});
  const[renamingId,setRenamingId]=useState(null);
  const[renameVal,setRenameVal]=useState('');
  const[newSecName,setNewSecName]=useState('');
  const[saveName,setSaveName]=useState('');
  const[saveOpen,setSaveOpen]=useState(false);
  const[savedToast,setSavedToast]=useState(false);
  const tog=key=>setExpanded(p=>({...p,[key]:!p[key]}));
  const uMeta=(f,v)=>setMeta(p=>({...p,[f]:v}));
  const uRev=(i,f,v)=>setMeta(p=>{const r=[...p.reviewers];r[i]={...r[i],[f]:v};return{...p,reviewers:r}});
  const db=databases.find(d=>d.folderName===activeDb);
  const dbIdx=databases.findIndex(d=>d.folderName===activeDb);
  const uSec=(secId,f,v)=>setDatabases(prev=>{const dbs=[...prev];const d={...dbs[dbIdx],sections:{...dbs[dbIdx].sections,[secId]:{...dbs[dbIdx].sections[secId],[f]:v}}};dbs[dbIdx]=d;return dbs});
  const uIssue=(i,f,v)=>setDatabases(prev=>{const dbs=[...prev];const issues=[...dbs[dbIdx].exaSummaryIssues];issues[i]={...issues[i],[f]:v};dbs[dbIdx]={...dbs[dbIdx],exaSummaryIssues:issues};return dbs});
  const addIssue=()=>setDatabases(prev=>{const dbs=[...prev];dbs[dbIdx]={...dbs[dbIdx],exaSummaryIssues:[...dbs[dbIdx].exaSummaryIssues,{section:'',problem:'',recommendation:'',risk:'Medium',impact:'Low',comment:''}]};return dbs});
  const delIssue=i=>setDatabases(prev=>{const dbs=[...prev];dbs[dbIdx]={...dbs[dbIdx],exaSummaryIssues:dbs[dbIdx].exaSummaryIssues.filter((_,j)=>j!==i)};return dbs});
  const uScConf=(i,f,v)=>setMeta(p=>{const sc=[...p.sectionsConfig];sc[i]={...sc[i],[f]:v};return{...p,sectionsConfig:sc}});
  const moveSecConf=(i,dir)=>setMeta(p=>{const sc=[...p.sectionsConfig];const j=i+dir;if(j<0||j>=sc.length)return p;[sc[i],sc[j]]=[sc[j],sc[i]];return{...p,sectionsConfig:sc}});
  const delSecConf=i=>setMeta(p=>({...p,sectionsConfig:p.sectionsConfig.filter((_,j)=>j!==i)}));
  const addCustomSec=()=>{
    if(!newSecName.trim())return;
    const id='custom_'+Date.now();
    setMeta(p=>({...p,sectionsConfig:[...p.sectionsConfig,{id,name:newSecName.trim(),enabled:true,contentType:'table',defaultRec:'',isCustom:true}]}));
    setDatabases(prev=>prev.map(d=>({...d,sections:{...d.sections,[id]:{tableColumns:[],tableRows:[],screenshots:[]}}})));
    setNewSecName('');
  };
  const handleScreenshotUpload=(secId,e)=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    files.forEach(file=>{
      const reader=new FileReader();
      reader.onload=ev=>{const type=file.type==='image/png'?'png':'jpg';
        setDatabases(prev=>{const dbs=[...prev];const idx2=dbs.findIndex(d=>d.folderName===activeDb);if(idx2<0)return prev;const sec=dbs[idx2].sections[secId]||{};const ss=[...(sec.screenshots||[]),{data:ev.target.result,type,name:file.name}];dbs[idx2]={...dbs[idx2],sections:{...dbs[idx2].sections,[secId]:{...sec,screenshots:ss}}};return[...dbs]});
      };reader.readAsDataURL(file);
    });
  };
  const removeScreenshot=(secId,si)=>setDatabases(prev=>{const dbs=[...prev];const idx2=dbs.findIndex(d=>d.folderName===activeDb);if(idx2<0)return prev;const sec=dbs[idx2].sections[secId]||{};const ss=(sec.screenshots||[]).filter((_,j)=>j!==si);dbs[idx2]={...dbs[idx2],sections:{...dbs[idx2].sections,[secId]:{...sec,screenshots:ss}}};return[...dbs]});

  return(
    <div>
      <div style={{marginBottom:24,animation:'fadeUp 0.4s ease both'}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1b9aaa',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:8}}>Step 3 of 4</div>
        <h1 style={{fontSize:34,fontWeight:900,color:'#0f2b3d',letterSpacing:'-0.03em',marginBottom:6,lineHeight:1.1}}>Edit Report Content</h1>
        <p style={{color:'#5a7184',fontSize:14}}>Review and adjust auto-filled data before generating the DOCX.</p>
      </div>

      {/* Report Metadata */}
      <div style={{...S.card,marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:14,color:'#0f2b3d',flex:1}}>Report Information</div>
          {!saveOpen&&<button onClick={()=>{setSaveName(`${meta.clientName||'Client'} — ${meta.reportTitle||'Report'}`);setSaveOpen(true)}} style={{...S.lb,cursor:'pointer',marginTop:0,fontSize:12,color:'#1b9aaa',fontWeight:700,border:'1px solid #b0d4e8',borderRadius:7,padding:'5px 12px',background:'#f0fafb'}}>Save Template</button>}
          {saveOpen&&(
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input value={saveName} onChange={e=>setSaveName(e.target.value)} style={{...S.inp,padding:'5px 9px',fontSize:12,width:220}} placeholder="Template name"/>
              <button onClick={()=>{sto.saveTemplate(saveName.trim()||'Unnamed',meta);setSaveOpen(false);setSavedToast(true);setTimeout(()=>setSavedToast(false),2000)}} style={{...S.pb,padding:'5px 12px',fontSize:12}}>Save</button>
              <button onClick={()=>setSaveOpen(false)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#a0b4c0',lineHeight:1}}>×</button>
            </div>
          )}
          {savedToast&&<span style={{fontSize:12,color:'#16a34a',fontWeight:700,marginLeft:8}}>✓ Saved</span>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
          <DI label="Client Name" value={meta.clientName} onChange={v=>uMeta('clientName',v)} placeholder="e.g. JICT"/>
          <DI label="Report Period" value={meta.period} onChange={v=>uMeta('period',v)} placeholder="February 2026"/>
          <DI label="Company" value={meta.companyName} onChange={v=>uMeta('companyName',v)}/>
          <DI label="Report Title" value={meta.reportTitle} onChange={v=>uMeta('reportTitle',v)}/>
          <DI label="Author Name" value={meta.authorName} onChange={v=>uMeta('authorName',v)} placeholder="Your name"/>
          <DI label="Doc Date" type="date" value={meta.docDate} onChange={v=>uMeta('docDate',v)}/>
          <DI label="Data Collection Date" type="date" value={meta.dataCollectionDate} onChange={v=>uMeta('dataCollectionDate',v)}/>
          <DI label="Doc Version" value={meta.docVersion} onChange={v=>uMeta('docVersion',v)}/>
        </div>
        <div style={{marginTop:4}}>
          <label style={S.lb}>Overall Condition</label>
          <select value={meta.overallCondition} onChange={e=>uMeta('overallCondition',e.target.value)} style={S.inp}>
            <option>good condition</option><option>fair condition</option>
            <option>requires attention</option><option>critical condition</option>
          </select>
        </div>
        <div style={{marginTop:16}}>
          <div style={{fontWeight:700,fontSize:13,color:'#0f2b3d',marginBottom:10}}>Reviewers</div>
          {meta.reviewers.map((r,i)=>(
            <div key={i} style={{display:'flex',gap:8,marginBottom:8,alignItems:'flex-end'}}>
              <DI label={i===0?"Name":""} value={r.name} onChange={v=>uRev(i,'name',v)} placeholder="Name" style={{flex:1}}/>
              <DI label={i===0?"Position":""} value={r.position} onChange={v=>uRev(i,'position',v)} placeholder="Position" style={{flex:1}}/>
              <DI label={i===0?"Company":""} value={r.company||""} onChange={v=>uRev(i,'company',v)} placeholder="Company" style={{flex:1}}/>
              {meta.reviewers.length>1&&<button onClick={()=>setMeta(p=>({...p,reviewers:p.reviewers.filter((_,j)=>j!==i)}))} style={{background:'none',border:'1px solid #e2eaf0',borderRadius:8,padding:'9px 10px',cursor:'pointer',color:'#e53e3e',marginBottom:0}}>×</button>}
            </div>
          ))}
          <button onClick={()=>setMeta(p=>({...p,reviewers:[...p.reviewers,{name:'',position:'',company:''}]}))} style={S.ab}>+ Add Reviewer</button>
        </div>
      </div>

      {/* DB Tab selector (multiple DBs) */}
      {databases.length>1&&(
        <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          {databases.map(d=>(
            <button key={d.folderName} onClick={()=>setActiveDb(d.folderName)}
              style={{padding:'7px 16px',borderRadius:8,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
                background:activeDb===d.folderName?'#0f4c75':'#e8f0f8',
                color:activeDb===d.folderName?'#fff':'#0f4c75'}}>
              {d.folderName}
            </button>
          ))}
        </div>
      )}

      {db&&(
        <div key={activeDb}>
          {/* Executive Summary Issues */}
          <div style={{...S.card,marginBottom:14}}>
            <div style={{fontWeight:800,fontSize:14,color:'#0f2b3d',marginBottom:12}}>Executive Summary Issues
              {db.flags.length>0&&<span style={{marginLeft:8,...S.tag,background:'#fff5f5',color:'#e53e3e'}}>{db.flags.length} auto-detected</span>}
            </div>
            {(db.exaSummaryIssues||[]).map((iss,i)=>(
              <div key={i} style={{border:'1px solid #e2eaf0',borderRadius:8,padding:12,marginBottom:8,background:'#fafcff'}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 12px'}}>
                  <DI label="Section" value={iss.section} onChange={v=>uIssue(i,'section',v)} placeholder="e.g. Tablespace"/>
                  <DI label="Impact" value={iss.impact} onChange={v=>uIssue(i,'impact',v)} placeholder="High / Medium / Low"/>
                </div>
                <DI label="Problem" value={iss.problem} onChange={v=>uIssue(i,'problem',v)} placeholder="Describe the issue"/>
                <DI label="Recommendation" value={iss.recommendation} onChange={v=>uIssue(i,'recommendation',v)} placeholder="Recommended action"/>
                {(db.exaSummaryIssues||[]).length>1&&<button onClick={()=>delIssue(i)} style={{background:'none',border:'none',color:'#e53e3e',cursor:'pointer',fontSize:12,marginTop:6}}>× Remove</button>}
              </div>
            ))}
            <button onClick={addIssue} style={S.ab}>+ Add Issue</button>
          </div>

          {/* Sections */}
          {(meta.sectionsConfig||defaultSectionsConfig).map((sc,sci)=>{
            const sec=db.sections[sc.id]||{};
            const key=`${db.folderName}-${sc.id}`;const isOpen=expanded[key];
            const hasTable=sec.tableColumns?.length>0;
            const ct=sc.contentType||'table';
            const ctBtn=(val,label)=>(
              <button onClick={()=>uScConf(sci,'contentType',val)} style={{padding:'4px 10px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11,fontWeight:700,background:ct===val?'#0f4c75':'#e8f0f8',color:ct===val?'#fff':'#0f4c75'}}>{label}</button>
            );
            return(
              <div key={sc.id} style={{...S.card,marginBottom:8,padding:0,overflow:'hidden',opacity:sc.enabled?1:0.6}}>
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'11px 16px',background:isOpen?'#f7fafc':'#fff',cursor:'pointer'}} onClick={()=>sc.enabled&&tog(key)}>
                  {/* Enable toggle */}
                  <button onClick={e=>{e.stopPropagation();uScConf(sci,'enabled',!sc.enabled)}} title={sc.enabled?'Disable section':'Enable section'}
                    style={{padding:'3px 9px',borderRadius:20,border:'none',cursor:'pointer',fontSize:11,fontWeight:700,flexShrink:0,background:sc.enabled?'#d1fae5':'#f0f0f0',color:sc.enabled?'#065f46':'#888'}}>
                    {sc.enabled?'ON':'OFF'}
                  </button>
                  {/* Section name (dbl-click to rename) */}
                  {renamingId===sc.id?(
                    <input value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                      onBlur={()=>{if(renameVal.trim())uScConf(sci,'name',renameVal.trim());setRenamingId(null)}}
                      onKeyDown={e=>{if(e.key==='Enter'){if(renameVal.trim())uScConf(sci,'name',renameVal.trim());setRenamingId(null)}if(e.key==='Escape')setRenamingId(null)}}
                      autoFocus onClick={e=>e.stopPropagation()}
                      style={{...S.inp,padding:'3px 8px',fontSize:13,fontWeight:700,width:160,flex:'none'}}/>
                  ):(
                    <span onDoubleClick={e=>{e.stopPropagation();setRenamingId(sc.id);setRenameVal(sc.name)}}
                      style={{fontWeight:700,fontSize:13,color:'#0f2b3d',flex:1,cursor:'text'}} title="Double-click to rename">{sc.name}</span>
                  )}
                  {hasTable&&<span style={{...S.tag,background:'#e8f0f8',color:'#0f4c75',fontSize:10}}>table</span>}
                  {/* Reorder */}
                  <button onClick={e=>{e.stopPropagation();moveSecConf(sci,-1)}} style={{background:'none',border:'none',cursor:'pointer',color:'#a0b4c0',fontSize:13,padding:'2px 4px'}} title="Move up">▲</button>
                  <button onClick={e=>{e.stopPropagation();moveSecConf(sci,1)}} style={{background:'none',border:'none',cursor:'pointer',color:'#a0b4c0',fontSize:13,padding:'2px 4px'}} title="Move down">▼</button>
                  {sc.isCustom&&<button onClick={e=>{e.stopPropagation();delSecConf(sci)}} style={{background:'none',border:'none',cursor:'pointer',color:'#e53e3e',fontSize:16,padding:'2px 5px'}} title="Delete section">×</button>}
                  <span onClick={e=>{e.stopPropagation();sc.enabled&&tog(key)}} style={{color:'#a0b4c0',fontSize:11}}>{isOpen&&sc.enabled?'▲':'▼'}</span>
                </div>
                {isOpen&&sc.enabled&&(
                  <div style={{padding:'4px 18px 18px'}}>
                    {/* Content type selector */}
                    <div style={{display:'flex',gap:6,margin:'10px 0 8px',alignItems:'center'}}>
                      <span style={{fontSize:11,color:'#5a7184',marginRight:4}}>Content:</span>
                      {ctBtn('table','Table')}{ctBtn('image','Image')}{ctBtn('table+image','Table+Image')}{ctBtn('none','None')}
                    </div>
                    {/* Table editor */}
                    {(ct==='table'||ct==='table+image')&&sc.id!=='cpu'&&(
                      <TableEditor columns={sec.tableColumns||[]} rows={sec.tableRows||[]} onColumnsChange={v=>uSec(sc.id,'tableColumns',v)} onRowsChange={v=>uSec(sc.id,'tableRows',v)}/>
                    )}
                    {/* CPU chart / image */}
                    {sc.id==='cpu'&&(ct==='image'||ct==='table+image')&&(
                      <div>
                        <div style={{display:'flex',gap:8,marginBottom:10,marginTop:4}}>
                          <button onClick={()=>uSec('cpu','inputMode','chart')} style={{padding:'6px 14px',borderRadius:7,border:'none',cursor:'pointer',fontSize:12,fontWeight:700,background:sec.inputMode==='chart'?'#0f4c75':'#e8f0f8',color:sec.inputMode==='chart'?'#fff':'#0f4c75'}}>Chart Data</button>
                          <button onClick={()=>uSec('cpu','inputMode','image')} style={{padding:'6px 14px',borderRadius:7,border:'none',cursor:'pointer',fontSize:12,fontWeight:700,background:sec.inputMode==='image'?'#0f4c75':'#e8f0f8',color:sec.inputMode==='image'?'#fff':'#0f4c75'}}>Upload Screenshot</button>
                        </div>
                        {sec.inputMode==='chart'&&db.parsed.cpuUtils?.rows?.length>0&&<CpuChart columns={db.parsed.cpuUtils.columns} rows={db.parsed.cpuUtils.rows.slice(0,300)} onCanvasReady={()=>{}}/>}
                        {sec.inputMode==='chart'&&!db.parsed.cpuUtils?.rows?.length&&<div style={{padding:'14px',background:'#fff5f5',borderRadius:8,fontSize:13,color:'#b91c1c'}}>No cpu_utils.txt data found.</div>}
                        {sec.inputMode==='image'&&(
                          <div style={{marginTop:4}}>
                            <label style={{display:'inline-flex',alignItems:'center',gap:8,cursor:'pointer',padding:'9px 16px',borderRadius:8,border:'1px dashed #b0c4d0',fontSize:13,color:'#1b9aaa',fontWeight:600,background:'#f7fafc'}}>
                              🖼 Upload Chart Screenshot
                              <input type="file" accept="image/png,image/jpeg" style={{display:'none'}} onChange={e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const bytes=new Uint8Array(ev.target.result);const type=file.type==='image/png'?'png':'jpg';uSec('cpu','chartImage',{data:bytes,type,name:file.name})};reader.readAsArrayBuffer(file);}}/>
                            </label>
                            {sec.chartImage&&<div style={{marginTop:8,fontSize:12,color:'#16a34a',fontWeight:600}}>✓ {sec.chartImage.name} selected</div>}
                          </div>
                        )}
                      </div>
                    )}
                    {/* Screenshot upload for non-cpu image sections */}
                    {sc.id!=='cpu'&&(ct==='image'||ct==='table+image')&&(
                      <div style={{marginTop:8}}>
                        <label style={{display:'inline-flex',alignItems:'center',gap:8,cursor:'pointer',padding:'8px 14px',borderRadius:8,border:'1px dashed #b0c4d0',fontSize:12,color:'#1b9aaa',fontWeight:600,background:'#f7fafc'}}>
                          🖼 Add Screenshot(s)
                          <input type="file" accept="image/png,image/jpeg" multiple style={{display:'none'}} onChange={e=>handleScreenshotUpload(sc.id,e)}/>
                        </label>
                        {(sec.screenshots||[]).length>0&&(
                          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>
                            {(sec.screenshots||[]).map((ss,si)=>(
                              <div key={si} style={{position:'relative',display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',background:'#f0fafb',borderRadius:6,fontSize:11,border:'1px solid #b0d4e8'}}>
                                <span>{ss.name||`screenshot_${si+1}`}</span>
                                <button onClick={()=>removeScreenshot(sc.id,si)} style={{background:'none',border:'none',cursor:'pointer',color:'#e53e3e',fontSize:14,padding:0,lineHeight:1}}>×</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                    <DTA label="Recommendation" value={sec.recommendation||sc.defaultRec} onChange={v=>uSec(sc.id,'recommendation',v)}/>
                  </div>
                )}
              </div>
            );
          })}
          {/* Add custom section */}
          <div style={{display:'flex',gap:8,marginTop:12,alignItems:'center'}}>
            <input value={newSecName} onChange={e=>setNewSecName(e.target.value)} placeholder="New section name..."
              style={{...S.inp,padding:'8px 12px',fontSize:13}} onKeyDown={e=>e.key==='Enter'&&addCustomSec()}/>
            <button onClick={addCustomSec} disabled={!newSecName.trim()} style={{...S.ab,marginTop:0,opacity:newSecName.trim()?1:0.5}}>+ Add Section</button>
          </div>
        </div>
      )}

      <div style={{marginTop:28,display:'flex',justifyContent:'flex-end'}}>
        <button onClick={onNext} style={{...S.pb,padding:'13px 30px',fontSize:14}}>Preview & Generate →</button>
      </div>
    </div>
  );
}

// ─── STEP 3: GENERATE ────────────────────────────────────────────────────────
function StepGenerate({databases,meta,logoData,clientLogoData}){
  const[mode,setMode]=useState('separate');
  const[gen,setGen]=useState(false);
  const[toast,setToast]=useState(null);
  const totalFlags=databases.reduce((s,db)=>s+db.flags.length,0);

  const buildPayload=(opts)=>{
    const{mode:m,db,dbs,dbsData}=opts;
    const reportData=buildReportData(db||databases[0],meta);
    return{
      meta:{clientName:meta.clientName,companyName:meta.companyName,
        reportTitle:meta.reportTitle,reviewers:meta.reviewers||[],
        databaseName:(db||databases[0])?.folderName||''},
      mode:m,
      db:db?{databaseName:db.folderName,serverType:db.parsed?.hostname?.osName||''}:undefined,
      dbs:(dbs||[]).map(d=>({databaseName:d.folderName,serverType:d.parsed?.hostname?.osName||''})),
      serverInfo:(db||databases[0])?.parsed?.serverInfo||{},
      databaseInfo:(db||databases[0])?.parsed?.databaseInfo||{},
      reportData:{
        ...reportData,
        sections:reportData.sections.map(sec=>({
          ...sec,
          cpuData:(db||databases[0])?.parsed?.cpuUtils||{},
        })),
      },
      dbsData:(dbsData||[]).map(d=>{
        const rd=buildReportData(d,meta);
        return{...rd,databaseName:d.folderName,sections:rd.sections.map(s=>({...s,cpuData:d.parsed?.cpuUtils||{}}))};
      }),
      logoData:logoData?`data:image/${logoData.type};base64,${uint8ToB64(logoData.data)}`:null,
      clientLogoData:clientLogoData?`data:image/${clientLogoData.type};base64,${uint8ToB64(clientLogoData.data)}`:null,
    };
  };

  const downloadOne=async(payload)=>{
    const res=await fetch('http://localhost:8000/generate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
    });
    if(!res.ok){const txt=await res.text();throw new Error(txt);}
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const cd=res.headers.get('Content-Disposition')||'';
    a.download=cd.match(/filename="(.+)"/)?.[1]||'report.docx';
    a.href=url;a.click();
    URL.revokeObjectURL(url);
  };

  const handleGenerate=async()=>{
    setGen(true);setToast(null);
    try{
      if(mode==='combined'){
        await downloadOne(buildPayload({mode:'combined',db:databases[0],dbs:databases,dbsData:databases}));
        setToast('✓ Combined report downloaded!');
      }else if(databases.length===1){
        await downloadOne(buildPayload({mode:'single',db:databases[0]}));
        setToast('✓ Report downloaded!');
      }else{
        for(let i=0;i<databases.length;i++){
          await downloadOne(buildPayload({mode:'separate',db:databases[i]}));
          if(i<databases.length-1)await new Promise(r=>setTimeout(r,380));
        }
        setToast(`✓ ${databases.length} reports downloaded!`);
      }
    }catch(e){console.error(e);setToast('Error: '+e.message);}
    finally{setGen(false);}
  };

  const modeOpts=[
    {val:'separate',label:'Separate Reports',desc:`One .docx per database (${databases.length} file${databases.length!==1?'s':''})`},
    {val:'combined',label:'Combined Report',desc:'All databases in one .docx'},
  ];

  return(
    <div style={{maxWidth:560,margin:'0 auto'}}>
      <div style={{marginBottom:28,animation:'fadeUp 0.4s ease both'}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1b9aaa',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:8}}>Step 4 of 4</div>
        <h1 style={{fontSize:34,fontWeight:900,color:'#0f2b3d',letterSpacing:'-0.03em',marginBottom:6,lineHeight:1.1}}>Generate Report</h1>
        <p style={{color:'#5a7184',fontSize:14}}>Review the summary below then click generate to download.</p>
      </div>

      {/* Summary Card */}
      <div style={{...S.card,marginBottom:16}}>
        <div style={{fontWeight:800,fontSize:14,color:'#0f2b3d',marginBottom:14}}>Summary</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'flex',gap:10,fontSize:13}}><span style={{color:'#16a34a',fontWeight:700}}>✓</span><span>{databases.length} database{databases.length!==1?'s':''} ready</span></div>
          {meta.clientName&&<div style={{display:'flex',gap:10,fontSize:13}}><span style={{color:'#16a34a',fontWeight:700}}>✓</span><span>Client: <strong>{meta.clientName}</strong></span></div>}
          {meta.period&&<div style={{display:'flex',gap:10,fontSize:13}}><span style={{color:'#16a34a',fontWeight:700}}>✓</span><span>Period: <strong>{meta.period}</strong></span></div>}
          {meta.authorName&&<div style={{display:'flex',gap:10,fontSize:13}}><span style={{color:'#16a34a',fontWeight:700}}>✓</span><span>Author: <strong>{meta.authorName}</strong></span></div>}
          {!meta.clientName&&<div style={{display:'flex',gap:10,fontSize:13}}><span style={{color:'#d97706',fontWeight:700}}>⚠</span><span style={{color:'#92400e'}}>Client name not set (edit in Step 3)</span></div>}
          {totalFlags>0&&<div style={{display:'flex',gap:10,fontSize:13}}><span style={{color:'#e53e3e',fontWeight:700}}>⚠</span><span>{totalFlags} issue{totalFlags!==1?'s':''} will appear in Executive Summary</span></div>}
        </div>
      </div>

      {/* Mode Selector */}
      <div style={{...S.card,marginBottom:20}}>
        <div style={{fontWeight:800,fontSize:14,color:'#0f2b3d',marginBottom:14}}>Report Mode</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {modeOpts.map(opt=>(
            <label key={opt.val} style={{display:'flex',gap:12,cursor:'pointer',padding:'12px 14px',borderRadius:9,border:`1px solid ${mode===opt.val?'#1b9aaa':'#e2eaf0'}`,background:mode===opt.val?'#f0fafb':'#fff',transition:'all 0.15s'}}>
              <input type="radio" value={opt.val} checked={mode===opt.val} onChange={()=>setMode(opt.val)} style={{accentColor:'#1b9aaa',marginTop:2,flexShrink:0}}/>
              <div><div style={{fontWeight:700,fontSize:13,color:'#0f2b3d'}}>{opt.label}</div><div style={{fontSize:12,color:'#7a8f9e',marginTop:2}}>{opt.desc}</div></div>
            </label>
          ))}
        </div>
      </div>

      {toast&&(
        <div style={{background:toast.startsWith('Error')?'#fff5f5':'#f0fdf4',border:`1px solid ${toast.startsWith('Error')?'#fca5a5':'#bbf7d0'}`,borderRadius:10,padding:'13px 16px',marginBottom:16,color:toast.startsWith('Error')?'#b91c1c':'#166534',fontWeight:600,fontSize:13}}>
          {toast}
        </div>
      )}

      <button onClick={handleGenerate} disabled={gen}
        style={{...S.pb,width:'100%',justifyContent:'center',fontSize:15,padding:'16px 24px',borderRadius:12,opacity:gen?0.7:1}}>
        {gen?'Generating...':`📄 Download ${mode==='combined'?'Combined Report':databases.length+' Report'+(databases.length!==1&&mode!=='combined'?'s':'')}`}
      </button>
    </div>
  );
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function Sidebar({step,setStep,databases,meta}){
  const totalFlags=databases.reduce((s,db)=>s+db.flags.length,0);
  const STEPS=['Load Data','Review','Edit','Generate'];
  return(
    <div style={{width:240,minWidth:240,background:'#0d1b2a',display:'flex',flexDirection:'column',padding:'24px 0',height:'100vh',position:'sticky',top:0,flexShrink:0}}>
      {/* Logo */}
      <div style={{padding:'0 20px 22px',borderBottom:'1px solid #1a2f42'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:34,height:34,background:'linear-gradient(135deg,#0f4c75,#1b9aaa)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>⚡</div>
          <div>
            <div style={{color:'#fff',fontWeight:900,fontSize:13,letterSpacing:'-0.01em'}}>Report Automation</div>
            <div style={{color:'#3d5a70',fontSize:10,marginTop:1}}>Oracle DB Health Check</div>
          </div>
        </div>
      </div>
      {/* Steps */}
      <div style={{padding:'16px 0',flex:1}}>
        {STEPS.map((label,i)=>{
          const isActive=step===i;const isDone=step>i;
          const isLocked=i>0&&databases.length===0&&i>step;
          return(
            <button key={i} onClick={()=>{if(!isLocked)setStep(i)}}
              style={{display:'flex',alignItems:'center',gap:11,width:'100%',padding:'11px 20px',
                background:isActive?'rgba(27,154,170,0.1)':'transparent',border:'none',
                borderLeft:isActive?'3px solid #1b9aaa':'3px solid transparent',
                cursor:isLocked?'default':'pointer',opacity:isLocked?0.3:1,transition:'all 0.15s'}}>
              <div style={{width:24,height:24,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
                background:isDone?'#1b9aaa':isActive?'rgba(27,154,170,0.18)':'rgba(255,255,255,0.05)',
                fontSize:11,fontWeight:800,color:isDone?'#fff':isActive?'#1b9aaa':'#3d5a70'}}>
                {isDone?'✓':i+1}
              </div>
              <span style={{fontSize:13,fontWeight:600,color:isActive?'#fff':isDone?'#6ec5d0':'#3d5a70'}}>{label}</span>
            </button>
          );
        })}
      </div>
      {/* Session info */}
      {databases.length>0&&(
        <div style={{padding:'16px 20px',borderTop:'1px solid #1a2f42'}}>
          <div style={{fontSize:10,fontWeight:700,color:'#2d4a5e',letterSpacing:'0.08em',marginBottom:8,textTransform:'uppercase'}}>Session</div>
          <div style={{fontSize:13,color:'#e2eaf0',marginBottom:3}}>{databases.length} database{databases.length!==1?'s':''} loaded</div>
          <div style={{fontSize:13,fontWeight:700,color:totalFlags>0?'#f87171':'#4ade80',marginBottom:3}}>
            {totalFlags>0?`${totalFlags} flag${totalFlags!==1?'s':''} detected`:'✓ No issues'}
          </div>
          {meta.clientName&&<div style={{fontSize:11,color:'#2d4a5e',marginTop:2}}>{meta.clientName}</div>}
        </div>
      )}
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App(){
  const[step,setStep]=useState(0);
  const[databases,setDatabases]=useState([]);
  const[logoData,setLogoData]=useState(null);
  const[clientLogoData,setClientLogoData]=useState(null);
  const[backendStatus,setBackendStatus]=useState('checking');
  const[meta,setMeta]=useState({
    clientName:'',companyName:'PT. Sisindokom Lintasbuana',
    reportTitle:'Preventive Maintenance',
    period:new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}),
    authorName:'',docVersion:'1.0',
    docDate:new Date().toISOString().split('T')[0],
    dataCollectionDate:new Date().toISOString().split('T')[0],
    overallCondition:'good condition',summaryText:'',
    reviewers:[{name:'',position:'',company:''}],
    sectionsConfig:[...defaultSectionsConfig],
  });
  useEffect(()=>{
    fetch('http://localhost:8000/health')
      .then(r=>r.ok?r.json():Promise.reject())
      .then(()=>setBackendStatus('ok'))
      .catch(()=>setBackendStatus('offline'));
  },[]);
  const handleLoad=useCallback(dbs=>{setDatabases(dbs);setStep(1)},[]);
  return(
    <div style={{display:'flex',width:'100%',height:'100vh',fontFamily:"'Inter',sans-serif"}}>
      <Sidebar step={step} setStep={setStep} databases={databases} meta={meta}/>
      <div style={{flex:1,overflowY:'auto',background:'#f7fafc',padding:'44px 48px',minWidth:0}}>
        {step===0&&<StepLoad onLoad={handleLoad} logoData={logoData} setLogoData={setLogoData} clientLogoData={clientLogoData} setClientLogoData={setClientLogoData} backendStatus={backendStatus} setMeta={setMeta}/>}
        {step===1&&<StepReview databases={databases} onNext={()=>setStep(2)}/>}
        {step===2&&<StepEdit databases={databases} meta={meta} setMeta={setMeta} setDatabases={setDatabases} onNext={()=>setStep(3)}/>}
        {step===3&&<StepGenerate databases={databases} meta={meta} logoData={logoData} clientLogoData={clientLogoData}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<script type="text/babel">
const {useState,useRef,useCallback,useEffect,useMemo}=React;

// ─── SECTION DEFINITIONS ────────────────────────────────────────────────────
const SECTION_DEFS=[
  {id:'cpu',      name:'CPU Utilization',      defaultRec:'CPU utilization is within acceptable range. Continue monitoring for any spikes during peak hours.'},
  {id:'memory',   name:'Memory Utilization',   defaultRec:'Memory usage is within acceptable limits. Monitor for any unusual consumption patterns.'},
  {id:'mountpoint',name:'Mount Point Usage',   defaultRec:'Continually check mount point usage and add more space or housekeep if reaching critical thresholds (>85%).'},
  {id:'tablespace',name:'Tablespace Status',   defaultRec:'Consider resizing or adding more datafiles for tablespaces with usage above 85%.'},
  {id:'datafile', name:'Data File Info',       defaultRec:'Data file I/O is within normal parameters.'},
  {id:'dbgrowth', name:'Database Growth',      defaultRec:'Database growth is consistent with expected trends.'},
  {id:'sessions', name:'Current Sessions',     defaultRec:'Session count is within normal range.'},
  {id:'fileio',   name:'File I/O Utilization', defaultRec:'Datafile I/O throughput is within acceptable parameters.'},
  {id:'invalid',  name:'Invalid Objects',      defaultRec:'No critical invalid objects found.'},
  {id:'optimizer',name:'Optimizer',            defaultRec:'Optimizer statistics are up to date.'},
  {id:'parallel', name:'Parallel',             defaultRec:'Parallel execution settings are appropriate.'},
  {id:'analyze',  name:'Analyze and Housekeep',defaultRec:'Trace and dump files reviewed. No abnormal activity.'},
  {id:'parameters',name:'Parameter Review',   defaultRec:'Database initialization parameters are properly configured.'},
  {id:'sgamemory',name:'SGA Memory',           defaultRec:'SGA memory allocation is adequate.'},
  {id:'dataguard',name:'Dataguard Review',     defaultRec:'Dataguard synchronization is operating normally.'},
  {id:'redo',     name:'Redo Transaction',     defaultRec:'Redo log transaction volume is within expected range.'},
  {id:'rman',     name:'RMAN Backup Status',   defaultRec:'RMAN backup completed successfully.'},
  {id:'performance',name:'Performance Review', defaultRec:'Overall database performance metrics are within acceptable thresholds.'},
];

const defaultSectionsConfig=SECTION_DEFS.map(sd=>({
  id:sd.id,name:sd.name,enabled:true,
  contentType:sd.id==='cpu'?'image':'table',
  defaultRec:sd.defaultRec,isCustom:false,
}));

// ─── STYLE TOKENS ───────────────────────────────────────────────────────────
const S={
  card:{background:'#fff',borderRadius:14,padding:24,boxShadow:'0 1px 6px rgba(13,27,42,0.07)',border:'1px solid #e2eaf0'},
  pb:{background:'linear-gradient(135deg,#0f4c75,#1b9aaa)',color:'#fff',border:'none',borderRadius:10,padding:'11px 24px',cursor:'pointer',fontSize:13,fontWeight:700,display:'inline-flex',alignItems:'center',gap:8,boxShadow:'0 2px 8px rgba(15,76,117,0.25)'},
  ab:{background:'none',border:'1px dashed #b0c4d0',borderRadius:8,padding:'7px 14px',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,fontSize:12,color:'#1b9aaa',fontWeight:600,marginTop:8},
  lb:{display:'block',fontSize:11,fontWeight:600,color:'#5a7184',marginBottom:3,marginTop:10},
  inp:{width:'100%',padding:'9px 12px',border:'1px solid #d0dce4',borderRadius:8,fontSize:13,color:'#1a2b3c',background:'#fafcff',outline:'none',fontFamily:"'Inter',sans-serif"},
  tag:{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700},
};

// ─── SMART RECOMMENDATIONS ───────────────────────────────────────────────────
function getSmartRec(id, secData, flags, cpuUtils){
  const rows=secData?.tableRows||[];
  const cols=secData?.tableColumns||[];
  const def=SECTION_DEFS.find(s=>s.id===id)?.defaultRec||'';

  switch(id){
    case 'tablespace':{
      // cols: Status, Tablespace, Curr Size (MB), Used (MB), Used %, Free (MB)
      const pI=cols.indexOf('Used %')>=0?cols.indexOf('Used %'):4;
      const nI=cols.indexOf('Tablespace')>=0?cols.indexOf('Tablespace'):1;
      const crit=rows.filter(r=>parseFloat(r[pI])>95);
      const warn=rows.filter(r=>parseFloat(r[pI])>85&&parseFloat(r[pI])<=95);
      if(!rows.length) return def;
      if(crit.length){
        const names=crit.map(r=>`${r[nI]} (${r[pI]})`).join(', ');
        return `Critical: ${names} ${crit.length===1?'is':'are'} critically full. Add datafiles or resize immediately.`
          +(warn.length?` Also monitor: ${warn.map(r=>r[nI]).join(', ')}.`:'');
      }
      if(warn.length){
        const names=warn.map(r=>`${r[nI]} (${r[pI]})`).join(', ');
        return `${names} ${warn.length===1?'is':'are'} above 85% usage. Consider adding datafiles or resizing before reaching critical levels.`;
      }
      return 'All tablespaces are within acceptable usage limits. Continue regular monitoring.';
    }
    case 'mountpoint':{
      // cols: Filesystem, Size, Used, Available, Use%, Mounted On
      const pI=cols.indexOf('Use%')>=0?cols.indexOf('Use%'):4;
      const mI=cols.indexOf('Mounted On')>=0?cols.indexOf('Mounted On'):5;
      const crit=rows.filter(r=>parseFloat(r[pI])>95);
      const warn=rows.filter(r=>parseFloat(r[pI])>85&&parseFloat(r[pI])<=95);
      if(!rows.length) return def;
      if(crit.length){
        const names=crit.map(r=>`${r[mI]} (${r[pI]})`).join(', ');
        return `Critical: ${names} ${crit.length===1?'is':'are'} critically full. Immediate housekeeping or capacity expansion required.`
          +(warn.length?` Also monitor: ${warn.map(r=>r[mI]).join(', ')}.`:'');
      }
      if(warn.length){
        const names=warn.map(r=>`${r[mI]} (${r[pI]})`).join(', ');
        return `${names} ${warn.length===1?'is':'are'} above 85% capacity. Schedule housekeeping or capacity expansion.`;
      }
      return 'All mount points are within acceptable usage. Continue monitoring at regular intervals.';
    }
    case 'rman':{
      // cols: Type, Status, Start Time, ...
      const sI=cols.indexOf('Status')>=0?cols.indexOf('Status'):1;
      const tI=cols.indexOf('Type')>=0?cols.indexOf('Type'):0;
      const dtI=cols.indexOf('Start Time')>=0?cols.indexOf('Start Time'):2;
      if(!rows.length) return def;
      const failed=rows.filter(r=>{const s=(r[sI]||'').trim().toUpperCase();return s&&!['COMPLETED','COMPLETED WITH WARNINGS',''].includes(s);});
      if(failed.length){
        const list=failed.map(r=>`${r[tI]} (${r[sI]}, ${r[dtI]})`).join('; ');
        return `Action required: the following backup job${failed.length>1?'s':''} did not complete successfully — ${list}. Investigate and resolve immediately.`;
      }
      return 'All RMAN backup jobs completed successfully within the reporting period.';
    }
    case 'sessions':{
      // cols: Instance, Peak Current, Max Allowed, Used %
      const pI=cols.indexOf('Used %')>=0?cols.indexOf('Used %'):3;
      const iI=cols.indexOf('Instance')>=0?cols.indexOf('Instance'):0;
      if(!rows.length) return def;
      const crit=rows.filter(r=>parseFloat(r[pI])>95);
      const warn=rows.filter(r=>parseFloat(r[pI])>90&&parseFloat(r[pI])<=95);
      if(crit.length){
        const names=crit.map(r=>`${r[iI]} (${r[pI]})`).join(', ');
        return `Critical: ${names} session utilization is critically high. Review and terminate idle sessions immediately, or increase the SESSIONS parameter.`;
      }
      if(warn.length){
        const names=warn.map(r=>`${r[iI]} (${r[pI]})`).join(', ');
        return `${names} session utilization is above 90%. Monitor closely and consider increasing the SESSIONS parameter if the trend continues.`;
      }
      return 'Session counts are within normal range for all instances.';
    }
    case 'cpu':{
      const cpuRows=cpuUtils?.rows||[];
      const cpuCols=cpuUtils?.columns||[];
      const mI=cpuCols.findIndex(c=>/max/i.test(c));
      if(mI>=0&&cpuRows.length){
        const peak=Math.max(...cpuRows.map(r=>parseFloat(r[mI])||0));
        if(peak>90) return `Critical CPU utilization detected — peak at ${peak.toFixed(1)}%. Immediate investigation required. Review top SQL, active sessions, and consider workload rescheduling.`;
        if(peak>80) return `Elevated CPU utilization detected — peak at ${peak.toFixed(1)}%. Monitor closely and review resource-intensive queries. Consider scheduling heavy workloads during off-peak hours.`;
        if(peak>60) return `CPU utilization peaks at ${peak.toFixed(1)}%, within manageable range. Continue monitoring during peak business hours.`;
        return `CPU utilization is within acceptable range (peak ${peak.toFixed(1)}%). No action required.`;
      }
      return def;
    }
    case 'dataguard':{
      // cols: Property, Value — rows include Database Role, Open Mode, MRP0 Status, etc.
      const roleRow=rows.find(r=>r[0]==='Database Role');
      const mrpRow=rows.find(r=>r[0]==='MRP0 Status');
      const role=(roleRow?.[1]||'').toUpperCase();
      const mrp=(mrpRow?.[1]||'');
      if(!rows.length) return def;
      if(role.includes('STANDBY')){
        if(mrp==='APPLYING_LOG') return 'Dataguard MRP process is actively applying logs. Synchronization is operating normally.';
        if(mrp&&mrp!=='N/A (Primary)') return `Dataguard MRP process status is "${mrp}" — not actively applying logs. Investigate synchronization and ensure the standby is receiving and applying redo data.`;
      }
      if(role==='PRIMARY') return 'Database is in PRIMARY role. Confirm standby synchronization is monitored separately.';
      return def;
    }
    case 'redo':{
      // cols: Thread, Date, Day, Total Switches
      const swI=cols.indexOf('Total Switches')>=0?cols.indexOf('Total Switches'):3;
      if(!rows.length) return def;
      const maxSw=Math.max(...rows.map(r=>parseInt(r[swI])||0));
      if(maxSw>50) return `High redo log switch frequency detected — up to ${maxSw} switches in a single day. Consider increasing redo log file sizes to reduce switch frequency and I/O overhead.`;
      if(maxSw>24) return `Redo log switches peak at ${maxSw}/day (more than once per hour). Monitor and consider resizing redo logs if this is a recurring pattern.`;
      return `Redo log switch frequency is within normal range (max ${maxSw}/day). No action required.`;
    }
    case 'invalid':{
      if(!rows.length) return 'No invalid objects found in the database.';
      return `Found ${rows.length} invalid object${rows.length>1?'s':''} in the database. Review and recompile as needed using DBMS_UTILITY.COMPILE_SCHEMA or manual ALTER ... COMPILE statements.`;
    }
    default: return def;
  }
}

// ─── TEMPLATE STORAGE ────────────────────────────────────────────────────────
const uint8ToB64=u8=>{let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);};

const sto={
  getTemplates:()=>JSON.parse(localStorage.getItem('ra_templates')||'[]'),
  saveTemplate:(name,meta)=>{
    const list=sto.getTemplates();
    const existing=list.findIndex(t=>t.name===name);
    const entry={id:existing>=0?list[existing].id:Date.now().toString(),name,savedAt:new Date().toISOString().split('T')[0],meta};
    if(existing>=0)list[existing]=entry;else list.push(entry);
    localStorage.setItem('ra_templates',JSON.stringify(list));
  },
  deleteTemplate:id=>{localStorage.setItem('ra_templates',JSON.stringify(sto.getTemplates().filter(t=>t.id!==id)));},
};

// ─── SHARED MICRO-COMPONENTS ─────────────────────────────────────────────────
function DI({label,value,onChange,style,multi,...props}){
  const[l,sL]=useState(value||"");const r=useRef(null);const f=useRef(false);
  useEffect(()=>{if(!f.current)sL(value||"")},[value]);
  const Tag=multi?"textarea":"input";
  return(<div style={style}>{label&&<label style={S.lb}>{label}</label>}
    <Tag ref={r} value={l} onChange={e=>sL(e.target.value)} onFocus={()=>{f.current=true}} onBlur={()=>{f.current=false;if(l!==(value||""))onChange(l)}}
      style={{...S.inp,...(multi?{minHeight:68,resize:'vertical'}:{})}} {...props}/></div>);
}
function DTA(p){return <DI {...p} multi={true}/>}

function TblCell({value,onChange,onEnter,onPasteGrid,ri,ci,selRange,setSelStart,setSelEnd,isDragging,setDragging}){
  const[l,sL]=useState(value||"");const f=useRef(false);
  useEffect(()=>{if(!f.current)sL(value||"")},[value]);
  const sel=selRange&&ri>=Math.min(selRange[0].ri,selRange[1].ri)&&ri<=Math.max(selRange[0].ri,selRange[1].ri)&&ci>=Math.min(selRange[0].ci,selRange[1].ci)&&ci<=Math.max(selRange[0].ci,selRange[1].ci);
  const handlePaste=e=>{
    const txt=e.clipboardData.getData('text/plain');
    if(!txt.includes('\t')&&!txt.includes('\n'))return;
    e.preventDefault();
    const grid=txt.trimEnd().split('\n').map(r=>r.replace(/\r$/,'').split('\t'));
    onPasteGrid(ri,ci,grid);
  };
  return <input className="tbl-input" value={l} title={l}
    style={{background:sel?'#bfdbfe':undefined,cursor:'default'}}
    onChange={e=>sL(e.target.value)}
    onFocus={()=>{f.current=true}}
    onBlur={()=>{f.current=false;if(l!==(value||""))onChange(l)}}
    onKeyDown={e=>{
      if(e.key==="Enter"){e.preventDefault();if(onEnter)onEnter(l)}
      if((e.key==="Delete"||e.key==="Backspace")&&sel&&selRange&&!(selRange[0].ri===selRange[1].ri&&selRange[0].ci===selRange[1].ci)){e.preventDefault();onChange("")}
    }}
    onMouseDown={e=>{if(e.shiftKey){e.preventDefault();setSelEnd({ri,ci});}else{setSelStart({ri,ci});setSelEnd({ri,ci});setDragging(true);}}}
    onMouseEnter={()=>{if(isDragging)setSelEnd({ri,ci});}}
    onMouseUp={()=>setDragging(false)}
    onPaste={handlePaste}/>;
}
function TblHeader({value,onChange}){
  const[l,sL]=useState(value||"");const f=useRef(false);
  useEffect(()=>{if(!f.current)sL(value||"")},[value]);
  return <input value={l} onChange={e=>sL(e.target.value)}
    onFocus={()=>{f.current=true}} onBlur={()=>{f.current=false;if(l!==(value||""))onChange(l)}}
    style={{background:'transparent',border:'none',color:'#fff',fontWeight:700,fontSize:11,width:'100%',outline:'none',fontFamily:'inherit'}}/>;
}

function TableEditor({columns,rows,onColumnsChange,onRowsChange}){
  const[selStart,setSelStart]=useState(null);
  const[selEnd,setSelEnd]=useState(null);
  const[dragging,setDragging]=useState(false);
  const selRange=selStart&&selEnd?[selStart,selEnd]:null;
  const updateCell=(ri,ci,v)=>{const nr=rows.map(r=>[...r]);if(!nr[ri])return;nr[ri][ci]=v;onRowsChange(nr)};
  const addRow=()=>onRowsChange([...rows,columns.map(()=>"")]);
  const removeRow=i=>{onRowsChange(rows.filter((_,j)=>j!==i));setSelStart(null);setSelEnd(null)};
  const addCol=()=>{const n="Col "+(columns.length+1);onColumnsChange([...columns,n]);onRowsChange(rows.map(r=>[...r,""]))};
  const removeCol=ci=>{onColumnsChange(columns.filter((_,j)=>j!==ci));onRowsChange(rows.map(r=>r.filter((_,j)=>j!==ci)));setSelStart(null);setSelEnd(null)};
  const updateColName=(ci,v)=>{const nc=[...columns];nc[ci]=v;onColumnsChange(nc)};
  const pasteGrid=(startRi,startCi,grid)=>{
    const newCols=[...columns];
    const newRows=rows.map(r=>[...r]);
    grid.forEach((gr,dri)=>{
      const tri=startRi+dri;
      while(newRows.length<=tri)newRows.push(newCols.map(()=>""));
      gr.forEach((cell,dci)=>{
        const tci=startCi+dci;
        while(newCols.length<=tci)newCols.push("Col "+(newCols.length+1));
        while(newRows[tri].length<=tci)newRows[tri].push("");
        newRows[tri][tci]=cell;
      });
    });
    onColumnsChange(newCols);onRowsChange(newRows);
  };
  const colW=Math.max(80,Math.min(180,Math.floor(600/Math.max(columns.length,1))));
  if(!columns.length)return(
    <div style={{marginTop:8}}>
      <button onClick={()=>{onColumnsChange(['Column 1','Column 2']);onRowsChange([['','']])}} style={S.ab}>+ Initialize Table</button>
      <span style={{fontSize:11,color:'#7a8f9e',marginLeft:8}}>or paste from Excel below</span>
      <PasteZone onPaste={(grid)=>{onColumnsChange(grid[0].map((_,i)=>'Col '+(i+1)));onRowsChange(grid)}}/>
    </div>
  );
  return(
    <div style={{marginTop:8,marginBottom:4}} onMouseLeave={()=>setDragging(false)}>
      <div style={{fontSize:10,color:'#7a8f9e',marginBottom:4}}>Click cell to edit · Shift+click to extend selection · Paste Excel/TSV data directly</div>
      <div style={{overflowX:'auto'}}>
        <table style={{borderCollapse:'collapse',fontSize:12,tableLayout:'fixed'}}>
          <colgroup>{columns.map((_,ci)=><col key={ci} style={{width:colW}}/>)}<col style={{width:28}}/></colgroup>
          <thead><tr>
            {columns.map((c,ci)=>(
              <th key={ci} style={{background:'#0f4c75',color:'#fff',padding:'6px 8px',border:'1px solid #0a3a5c',position:'relative',width:colW,maxWidth:colW}}>
                <TblHeader value={c} onChange={v=>updateColName(ci,v)}/>
                {columns.length>1&&<button onClick={()=>removeCol(ci)} style={{position:'absolute',top:2,right:2,background:'rgba(255,255,255,0.2)',border:'none',borderRadius:3,color:'#fff',cursor:'pointer',fontSize:9,padding:'1px 4px'}}>×</button>}
              </th>
            ))}
            <th style={{background:'#0f4c75',padding:'6px 4px',border:'1px solid #0a3a5c',width:28}}>
              <button onClick={addCol} style={{background:'rgba(255,255,255,0.2)',border:'none',borderRadius:3,color:'#fff',cursor:'pointer',fontSize:13,padding:'0 4px'}} title="Add column">+</button>
            </th>
          </tr></thead>
          <tbody>
            {rows.map((row,ri)=>(
              <tr key={ri}>
                {(row||[]).map((cell,ci)=>(
                  <td key={ci} style={{border:'1px solid #dde5eb',padding:2,width:colW,maxWidth:colW,overflow:'hidden'}}>
                    <TblCell value={cell} onChange={v=>updateCell(ri,ci,v)} ri={ri} ci={ci}
                      selRange={selRange} setSelStart={setSelStart} setSelEnd={setSelEnd}
                      isDragging={dragging} setDragging={setDragging}
                      onPasteGrid={pasteGrid}
                      onEnter={()=>{if(ri===rows.length-1)addRow()}}/>
                  </td>
                ))}
                <td style={{border:'1px solid #dde5eb',padding:2,textAlign:'center',width:28}}>
                  <button onClick={()=>removeRow(ri)} style={{background:'none',border:'none',color:'#d44',cursor:'pointer',fontSize:13}}>×</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',marginTop:6}}>
        <button onClick={addRow} style={{...S.ab,padding:'4px 10px',fontSize:11,marginTop:0}}>+ Row</button>
        {selRange&&(selRange[0].ri!==selRange[1].ri||selRange[0].ci!==selRange[1].ci)&&(
          <button onClick={()=>{
            const nr=rows.map(r=>[...r]);
            for(let r=Math.min(selRange[0].ri,selRange[1].ri);r<=Math.max(selRange[0].ri,selRange[1].ri);r++)
              for(let c=Math.min(selRange[0].ci,selRange[1].ci);c<=Math.max(selRange[0].ci,selRange[1].ci);c++)
                if(nr[r])nr[r][c]="";
            onRowsChange(nr);
          }} style={{...S.ab,padding:'4px 10px',fontSize:11,marginTop:0,color:'#e53e3e',borderColor:'#fca5a5'}}>Clear Selection</button>
        )}
      </div>
      <PasteZone onPaste={(grid)=>{
        const newCols=grid[0].map((_,i)=>columns[i]||'Col '+(i+1));
        onColumnsChange(newCols);onRowsChange(grid);
      }}/>
    </div>
  );
}
function PasteZone({onPaste}){
  const[hover,setHover]=useState(false);
  const handlePaste=e=>{
    const txt=e.clipboardData.getData('text/plain');
    if(!txt.trim())return;
    const grid=txt.trimEnd().split('\n').map(r=>r.replace(/\r$/,'').split('\t'));
    if(grid.length>0&&grid[0].length>1)onPaste(grid);
  };
  return(
    <div onPaste={handlePaste} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(t){const grid=t.trimEnd().split('\n').map(r=>r.replace(/\r$/,'').split('\t'));if(grid[0]?.length>1)onPaste(grid);}}}
      onFocus={()=>setHover(true)} onBlur={()=>setHover(false)} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      contentEditable suppressContentEditableWarning tabIndex={0}
      style={{marginTop:6,padding:'7px 12px',border:`1px dashed ${hover?'#1b9aaa':'#b0c4d0'}`,borderRadius:7,fontSize:11,color:'#7a8f9e',background:hover?'#f0fafb':'#fafcff',cursor:'text',outline:'none',userSelect:'none'}}
      onInput={e=>e.currentTarget.textContent=''}>
      Paste Excel / TSV data here to replace table
    </div>
  );
}

// ─── CPU CHART (ported from original app) ──────────────────────────────────
function CpuChart({columns,rows,onCanvasReady}){
  const cvRef=useRef(null);const chRef=useRef(null);
  const[instFilter,setInstFilter]=useState('All');
  const[fromDate,setFromDate]=useState('');const[toDate,setToDate]=useState('');
  const[groupBy,setGroupBy]=useState('none');
  const gi=pat=>columns.findIndex(c=>new RegExp(pat,'i').test(c));
  const instIdx=gi('instance');const lIdx=gi('begin')!==-1?gi('begin'):gi('snap')!==-1?gi('snap'):0;
  const mIdx=gi('max');const aIdx=gi('avg');
  const instances=instIdx!==-1?['All',...[...new Set(rows.map(r=>r[instIdx]).filter(Boolean))].sort()]:['All'];
  const parseDate=s=>{const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d)};
  const toN=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
  let r=(instFilter==='All'||instIdx===-1)?rows:rows.filter(row=>row[instIdx]===instFilter);
  if(fromDate||toDate){r=r.filter(row=>{const d=(row[lIdx]||'').slice(0,10);if(!d)return true;const dt=parseDate(d);if(fromDate&&fromDate.length===10&&dt<parseDate(fromDate))return false;if(toDate&&toDate.length===10&&dt>parseDate(toDate))return false;return true})}
  const applyGroupBy=src=>{
    if(groupBy==='none')return src;
    const map=new Map();
    src.forEach(row=>{let label;if(groupBy==='date')label=(row[lIdx]||'').slice(0,10);else{const hm=(row[lIdx]||'').match(/(\d{2}):\d{2}/);label=hm?hm[1]+':00':null}
    if(!label)return;if(!map.has(label))map.set(label,{maxVals:[],avgVals:[]});
    const g=map.get(label);const mv=toN(row[mIdx]);if(mv!==null)g.maxVals.push(mv);const av=toN(row[aIdx]);if(av!==null)g.avgVals.push(av)});
    return[...map.entries()].map(([label,g])=>{const out=Array(columns.length).fill('');out[lIdx]=label;out[mIdx]=g.maxVals.length?Math.max(...g.maxVals).toFixed(2):'';out[aIdx]=g.avgVals.length?(g.avgVals.reduce((a,b)=>a+b,0)/g.avgVals.length).toFixed(2):'';return out})};
  const displayRows=applyGroupBy(r);
  useEffect(()=>{
    if(!cvRef.current||!displayRows.length||typeof Chart==='undefined')return;
    const ctx=cvRef.current.getContext('2d');if(chRef.current)chRef.current.destroy();
    chRef.current=new Chart(ctx,{type:'line',data:{labels:displayRows.map(row=>row[lIdx]??''),datasets:[
      {label:'Max CPU%',data:displayRows.map(row=>toN(row[mIdx])),borderColor:'#d44',backgroundColor:'rgba(212,68,68,0.08)',tension:0.3,fill:true,pointRadius:2,borderWidth:2},
      {label:'Avg CPU%',data:displayRows.map(row=>toN(row[aIdx])),borderColor:'#1b9aaa',backgroundColor:'rgba(27,154,170,0.08)',tension:0.3,fill:true,pointRadius:2,borderWidth:2}
    ]},options:{responsive:false,plugins:{legend:{position:'top'}},scales:{y:{min:0,max:100,title:{display:true,text:'CPU %'},grid:{color:'#e8f1f5'}},x:{ticks:{maxRotation:45,font:{size:9}},grid:{color:'#e8f1f5'}}}}});
    if(onCanvasReady)onCanvasReady(cvRef.current);
    return()=>{if(chRef.current){chRef.current.destroy();chRef.current=null}};
  },[JSON.stringify(displayRows),JSON.stringify(columns)]);
  const ss={fontSize:11,padding:'2px 6px',borderRadius:4,border:'1px solid #c8d8e4',outline:'none',background:'#fff'};
  const lbl={fontSize:11,color:'#5a7184',margin:0};
  return(
    <div style={{marginTop:8,padding:'10px 12px',background:'#f8fbff',borderRadius:8,border:'1px solid #e2eaf0'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}}>
        <span style={{fontSize:12,fontWeight:700,color:'#0f4c75'}}>CPU Utilization Chart</span>
        {instances.length>1&&(<div style={{display:'flex',alignItems:'center',gap:4}}><label style={lbl}>Instance:</label>
          <select value={instFilter} onChange={e=>setInstFilter(e.target.value)} style={ss}>
            {instances.map(i=><option key={i} value={i}>{i==='All'?'All Instances':`Instance ${i}`}</option>)}
          </select></div>)}
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          <label style={lbl}>From:</label><input value={fromDate} onChange={e=>setFromDate(e.target.value)} placeholder="DD/MM/YYYY" style={{...ss,width:88}} maxLength={10}/>
          <label style={lbl}>To:</label><input value={toDate} onChange={e=>setToDate(e.target.value)} placeholder="DD/MM/YYYY" style={{...ss,width:88}} maxLength={10}/>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4}}><label style={lbl}>Group:</label>
          <select value={groupBy} onChange={e=>setGroupBy(e.target.value)} style={ss}>
            <option value="none">None</option><option value="date">Daily</option><option value="hour">Hourly</option>
          </select></div>
        <span style={{fontSize:11,color:'#a0b4c0',marginLeft:'auto'}}>{displayRows.length} pts</span>
      </div>
      <canvas ref={cvRef} width={680} height={230} style={{maxWidth:'100%',borderRadius:6,background:'#fff',display:'block'}}/>
    </div>
  );
}

// ─── PARSERS ────────────────────────────────────────────────────────────────
// Utility: parse SQL*Plus fixed-width output using the dash-separator line
function parseSQLPlusFixedWidth(text){
  if(!text)return null;
  const lines=text.split('\n');
  // Find the separator line (line of dashes and spaces, no other chars)
  const sepIdx=lines.findIndex(l=>/^[\-\s]+$/.test(l)&&l.includes('---'));
  if(sepIdx===-1)return null;
  const sepLine=lines[sepIdx];
  // Extract column ranges from dash runs
  const ranges=[];let i=0;
  while(i<sepLine.length){
    if(sepLine[i]==='-'){const start=i;while(i<sepLine.length&&sepLine[i]==='-')i++;ranges.push([start,i])}
    else i++;
  }
  if(!ranges.length)return null;
  // Header is the line just before separator
  const headerLine=lines[sepIdx-1]||'';
  const headers=ranges.map(([s,e])=>(headerLine.slice(s,e)||'').trim());
  // Data rows are after separator
  const dataRows=[];
  for(let j=sepIdx+1;j<lines.length;j++){
    const line=lines[j];
    if(!line.trim())continue;
    if(/^[\-\s]+$/.test(line)&&line.includes('---'))break;// next query block
    if(/rows? selected/i.test(line))continue;
    if(/^SQL>/i.test(line.trim()))break;
    const row=ranges.map(([s,e])=>(line.slice(s,e)||'').trim());
    if(row.some(c=>c))dataRows.push(row);
  }
  return{headers,rows:dataRows,ranges};
}

function parseMountpoint(text){
  if(!text)return{rows:[]};
  const RE=/^(\S+)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\d+)%\s+(.+)$/;
  const rows=[];
  for(const line of text.split('\n')){
    const m=line.match(RE);if(!m)continue;
    const pct=parseInt(m[5]);
    rows.push({filesystem:m[1],size:m[2],used:m[3],avail:m[4],pct,mountOn:m[6].trim(),flagged:pct>85});
  }
  return{rows};
}

function parseTablespace(text){
  if(!text)return{rows:[]};
  const p=parseSQLPlusFixedWidth(text);
  if(!p||!p.rows.length)return{rows:[]};
  const rows=p.rows.map(r=>({
    tablespaceName:r[0],aut:r[1],
    maxTsSize:parseFloat(r[2])||0,maxTsPctUsed:parseFloat(r[3])||0,
    currTsSize:parseFloat(r[4])||0,usedTsSize:parseFloat(r[5])||0,
    tsPctUsed:parseFloat(r[6])||0,freeTsSize:parseFloat(r[7])||0,tsPctFree:parseFloat(r[8])||0,
    flagged:(parseFloat(r[6])||0)>85,
  })).filter(r=>r.tablespaceName);
  return{rows};
}

function parseRman(text){
  if(!text)return{rows:[]};
  const p=parseSQLPlusFixedWidth(text);
  if(!p||!p.rows.length)return{rows:[]};
  const rows=p.rows.map(r=>({
    inputType:r[0],status:r[1],startTime:r[2],timeTaken:r[3],
    inputSizeGb:parseFloat(r[4])||0,outputSizeGb:parseFloat(r[5])||0,deviceType:r[6]||'',
    flagged:(r[1]||'').toUpperCase().includes('FAILED'),
  })).filter(r=>r.inputType);
  return{rows};
}

function parseCpuUtils(text){
  if(!text)return{columns:[],rows:[]};
  const p=parseSQLPlusFixedWidth(text);
  if(!p||!p.rows.length)return{columns:[],rows:[]};
  const seen=new Set();const rows=[];
  for(const row of p.rows){
    const key=`${row[0]}-${row[3]}`;
    if(seen.has(key))continue;seen.add(key);rows.push(row);
  }
  return{columns:p.headers,rows};
}

function parseSessionCount(text){
  if(!text)return{rows:[]};
  const p=parseSQLPlusFixedWidth(text);
  if(!p||!p.rows.length)return{rows:[]};
  const seen=new Set();const rows=[];
  for(const row of p.rows){
    const key=`${row[0]}-${row[3]}-${row[4]}`;
    if(seen.has(key))continue;seen.add(key);
    const current=parseFloat(row[5])||0;const max=parseFloat(row[6])||0;
    const ratio=max>0?current/max:0;
    rows.push({snapId:row[0],beginTime:row[1],endTime:row[2],instanceNum:row[3],
      resourceName:row[4],current,max,ratio,flagged:ratio>0.9});
  }
  return{rows};
}

function parseRedolog(text){
  if(!text)return{rows:[]};
  // Pre-process: join wrapped lines (single number on its own line = h23 wrapping)
  const rawLines=text.split('\n');
  const mergedLines=[];
  for(const line of rawLines){
    if(/^\s+\d+\s*$/.test(line)&&mergedLines.length>0)mergedLines[mergedLines.length-1]+=' '+line.trim();
    else mergedLines.push(line);
  }
  const p=parseSQLPlusFixedWidth(mergedLines.join('\n'));
  if(!p||!p.rows.length)return{rows:[]};
  const rows=p.rows.map(r=>({
    thread:r[0],date:r[1],day:r[2],total:parseInt(r[3])||0,
    hours:r.slice(4).map(v=>parseInt(v)||0),
  })).filter(r=>r.thread);
  return{rows};
}

function parseStatus(text){
  if(!text)return{};
  const dbRole=(/PHYSICAL STANDBY|LOGICAL STANDBY/i.exec(text)||[])[0]
    ||(text.match(/\bPRIMARY\b/)?'PRIMARY':null)||'UNKNOWN';
  const openMode=(/READ ONLY WITH APPLY|READ WRITE|MOUNTED|READ ONLY/i.exec(text)||[])[0]||'UNKNOWN';
  const protectionMode=(/MAXIMUM PERFORMANCE|MAXIMUM AVAILABILITY|MAXIMUM PROTECTION/i.exec(text)||[])[0]||'UNKNOWN';
  const switchoverStatus=(/NOT ALLOWED|SESSIONS ACTIVE|TO PRIMARY|TO STANDBY/i.exec(text)||[])[0]||'UNKNOWN';
  let mrpStatus=null;
  const mrpLine=text.split('\n').find(l=>l.includes('MRP0'));
  if(mrpLine){const mm=(/APPLYING_LOG|WAIT_FOR_LOG|RECEIVING/i.exec(mrpLine)||[]);if(mm[0])mrpStatus=mm[0]}
  let dbName='';
  const nameLines=text.split('\n').filter(l=>/^[A-Z]{2,12}\s+/.test(l.trim()));
  if(nameLines.length>0)dbName=nameLines[0].trim().split(/\s+/)[0];
  return{dbName,dbRole,openMode,protectionMode,switchoverStatus,mrpStatus,
    isStandby:dbRole.includes('STANDBY'),isMrpHealthy:mrpStatus==='APPLYING_LOG'};
}

function parseHostnamectl(text){
  if(!text)return{};
  const result={};
  for(const line of text.split('\n')){
    const m=line.match(/^\s*([\w\s()]+?):\s*(.+)$/);
    if(m)result[m[1].trim().toLowerCase().replace(/\s+/g,'_')]=m[2].trim();
  }
  return{hostname:result['static_hostname']||result['hostname']||'',
    osName:result['operating_system']||'',kernelVersion:result['kernel']||'',
    architecture:result['architecture']||'',virtualization:result['virtualization']||''};
}

function parseCpuCount(text){
  if(!text)return{};
  const result={};
  for(const line of text.split('\n')){const m=line.match(/^([^:]+):\s*(.+)$/);if(m)result[m[1].trim()]=m[2].trim()}
  return{cpuCount:parseInt(result['CPU(s)'])||0,cpuModel:result['Model name']||'',
    threadsPerCore:parseInt(result['Thread(s) per core'])||1,
    coresPerSocket:parseInt(result['Core(s) per socket'])||1,sockets:parseInt(result['Socket(s)'])||1};
}

function parseMemory(text){
  if(!text)return{totalGb:0,usedGb:0,freeGb:0};
  const lines=text.split('\n').filter(l=>l.trim());
  const memLine=lines.find(l=>l.startsWith('Mem:'));
  if(!memLine)return{totalGb:0,usedGb:0,freeGb:0};
  const parts=memLine.trim().split(/\s+/);
  const parseH=s=>{if(!s)return 0;const m=s.match(/^([\d.]+)([TtGgMmKk]i?)?/);if(!m)return 0;const n=parseFloat(m[1]);const u=(m[2]||'').toLowerCase();
    if(u.startsWith('t'))return n*1024;if(u.startsWith('g'))return n;if(u.startsWith('m'))return n/1024;if(u.startsWith('k'))return n/1024/1024;return n};
  return{totalGb:parseH(parts[1]),usedGb:parseH(parts[2]),freeGb:parseH(parts[3])};
}

function parseAsm(text){
  if(!text)return{groups:[]};
  const p=parseSQLPlusFixedWidth(text);
  if(!p||!p.rows.length)return{groups:[]};
  const groups=p.rows.map(r=>{
    const name=r[0];const state=r[1]||'';
    const totalGb=parseFloat((r[2]||'').replace(/,/g,''))||0;
    const freeGb=parseFloat((r[3]||'').replace(/,/g,''))||0;
    const pctFree=totalGb>0?parseFloat((freeGb/totalGb*100).toFixed(1)):0;
    return{name,state,totalGb,freeGb,pctFree,flagged:pctFree<15};
  }).filter(g=>g.name);
  return{groups};
}

function parseAllFiles(files){
  return{
    mountpoint:parseMountpoint(files['total_mountpoint']||files['mountpoint']||''),
    tablespace:parseTablespace(files['size_tablespace']||''),
    rman:parseRman(files['2_rman']||''),
    cpuUtils:parseCpuUtils(files['cpu_utils']||''),
    sessions:parseSessionCount(files['session_count']||''),
    redolog:parseRedolog(files['redolog_switch']||''),
    status:parseStatus(files['1_status']||''),
    hostname:parseHostnamectl(files['hostnamectl']||''),
    cpuInfo:parseCpuCount(files['cpu-count-linux']||''),
    memory:parseMemory(files['memtotal-linux-mb']||files['memtotal-linux']||''),
    asm:parseAsm(files['asm_usage']||files['9_check_ASM']||''),
  };
}

// ─── THRESHOLD ANALYSIS ─────────────────────────────────────────────────────
function analyzeDatabase(parsed){
  const flags=[];

  // Mount points > 85%
  for(const row of parsed.mountpoint?.rows||[]){
    if(row.pct>85)flags.push({section:'Mount Point Usage',severity:row.pct>95?'critical':'warning',
      item:row.mountOn,metric:'Use%',value:row.pct,threshold:85,
      message:`${row.mountOn} is ${row.pct}% full`});
  }

  // Tablespace > 85%
  for(const row of parsed.tablespace?.rows||[]){
    if(row.tsPctUsed>85)flags.push({section:'Tablespace Status',severity:row.tsPctUsed>95?'critical':'warning',
      item:row.tablespaceName,metric:'TS_PCT_USED',value:row.tsPctUsed,threshold:85,
      message:`${row.tablespaceName} is ${row.tsPctUsed.toFixed(1)}% used`});
  }

  // RMAN FAILED
  for(const row of parsed.rman?.rows||[]){
    if(row.flagged)flags.push({section:'RMAN Backup Status',severity:'critical',
      item:`${row.inputType} @ ${row.startTime}`,metric:'STATUS',value:row.status,threshold:'No FAILED',
      message:`Backup FAILED: ${row.inputType} started ${row.startTime}`});
  }

  // Sessions > 90%
  const instPeak={};
  for(const row of parsed.sessions?.rows||[]){
    const k=row.instanceNum;
    if(!instPeak[k]||row.ratio>instPeak[k].ratio)instPeak[k]={ratio:row.ratio,row};
  }
  for(const{ratio,row}of Object.values(instPeak)){
    if(ratio>0.90)flags.push({section:'Current Sessions',severity:ratio>0.95?'critical':'warning',
      item:`Instance ${row.instanceNum}`,metric:'Session Utilization',
      value:(ratio*100).toFixed(1)+'%',threshold:'90%',
      message:`Instance ${row.instanceNum}: ${row.current?.toFixed(0)} / ${row.max?.toFixed(0)} sessions (${(ratio*100).toFixed(1)}%)`});
  }

  // ASM free < 15%
  for(const g of parsed.asm?.groups||[]){
    if(g.pctFree<15)flags.push({section:'ASM Disk Groups',severity:g.pctFree<5?'critical':'warning',
      item:g.name,metric:'% Free',value:g.pctFree,threshold:15,
      message:`ASM group ${g.name} only ${g.pctFree}% free`});
  }

  return flags;
}

// ─── SECTION AUTO-FILL ───────────────────────────────────────────────────────
function buildSectionsFromParsed(parsed,flags){
  const secs={};
  SECTION_DEFS.forEach(sd=>{secs[sd.id]={tableColumns:[],tableRows:[],recommendation:sd.defaultRec}});

  // CPU Utilization — chart only (no table), track chartImage/inputMode per-section
  secs.cpu.tableColumns=[];
  secs.cpu.tableRows=[];
  secs.cpu.chartImage=null;
  secs.cpu.inputMode=parsed.cpuUtils?.rows?.length?'chart':'image';

  // Mount Point Usage
  if(parsed.mountpoint?.rows?.length){
    secs.mountpoint.tableColumns=['Filesystem','Size','Used','Available','Use%','Mounted On'];
    secs.mountpoint.tableRows=parsed.mountpoint.rows.map(r=>[r.filesystem,r.size,r.used,r.avail,r.pct+'%',r.mountOn]);
  }

  // Tablespace Status
  if(parsed.tablespace?.rows?.length){
    secs.tablespace.tableColumns=['Tablespace','Curr Size (MB)','Used (MB)','Used %','Free (MB)','Auto Ext'];
    secs.tablespace.tableRows=parsed.tablespace.rows.map(r=>[r.tablespaceName,r.currTsSize?.toFixed(0),r.usedTsSize?.toFixed(0),r.tsPctUsed?.toFixed(2)+'%',r.freeTsSize?.toFixed(0),r.aut]);
  }

  // Current Sessions (aggregate peak per instance)
  if(parsed.sessions?.rows?.length){
    const instPeak={};
    parsed.sessions.rows.forEach(r=>{const k=r.instanceNum;if(!instPeak[k]||r.current>instPeak[k].current)instPeak[k]=r});
    secs.sessions.tableColumns=['Instance','Peak Current','Max Allowed','Used %'];
    secs.sessions.tableRows=Object.values(instPeak).map(r=>['Instance '+r.instanceNum,r.current?.toFixed(0),r.max?.toFixed(0),(r.ratio*100).toFixed(1)+'%']);
  }

  // RMAN Backup Status
  if(parsed.rman?.rows?.length){
    secs.rman.tableColumns=['Type','Status','Start Time','Duration','Input (GB)','Output (GB)','Device'];
    secs.rman.tableRows=parsed.rman.rows.map(r=>[r.inputType,r.status,r.startTime,r.timeTaken,r.inputSizeGb?.toFixed(1),r.outputSizeGb?.toFixed(1),r.deviceType]);
  }

  // Redo Transaction
  if(parsed.redolog?.rows?.length){
    secs.redo.tableColumns=['Thread','Date','Day','Total Switches'];
    secs.redo.tableRows=parsed.redolog.rows.map(r=>[r.thread,r.date,r.day,String(r.total)]);
  }

  // Dataguard Review
  if(parsed.status?.dbRole){
    const s=parsed.status;
    secs.dataguard.tableColumns=['Property','Value'];
    secs.dataguard.tableRows=[
      ['Database Role',s.dbRole||''],['Open Mode',s.openMode||''],
      ['Protection Mode',s.protectionMode||''],['Switchover Status',s.switchoverStatus||''],
      ['MRP0 Status',s.mrpStatus||'N/A (Primary)'],
    ];
  }

  return secs;
}

async function renderCpuChartToImage(cpuData){
  if(!cpuData||!cpuData.rows||!cpuData.rows.length)return null;
  const canvas=document.createElement('canvas');
  canvas.width=800;canvas.height=400;
  const ctx=canvas.getContext('2d');
  const cols=cpuData.columns;const rows=cpuData.rows;
  const gi=pat=>cols.findIndex(c=>new RegExp(pat,'i').test(c));
  const lIdx=gi('begin')!==-1?gi('begin'):gi('snap')!==-1?gi('snap'):0;
  const mIdx=gi('max');const aIdx=gi('avg');const instIdx=gi('instance');
  const toN=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
  const instances=[...new Set(rows.map(r=>r[instIdx]).filter(Boolean))];
  const COLORS=['#d44','#1b9aaa','#f59e0b','#8b5cf6'];
  const datasets=instances.length>1
    ?instances.map((inst,i)=>{const ir=rows.filter(r=>r[instIdx]===inst);return{label:`Inst ${inst} Max%`,data:ir.map(r=>toN(r[mIdx])),borderColor:COLORS[i%COLORS.length],tension:0.3,fill:false,pointRadius:2,borderWidth:2}})
    :[{label:'Max CPU%',data:rows.map(r=>toN(r[mIdx])),borderColor:'#d44',backgroundColor:'rgba(212,68,68,0.08)',tension:0.3,fill:true,pointRadius:2,borderWidth:2},
      {label:'Avg CPU%',data:rows.map(r=>toN(r[aIdx])),borderColor:'#1b9aaa',backgroundColor:'rgba(27,154,170,0.08)',tension:0.3,fill:true,pointRadius:2,borderWidth:2}];
  const chart=new Chart(ctx,{type:'line',data:{labels:rows.map(r=>(r[lIdx]||'').slice(0,16)),datasets},options:{animation:false,responsive:false,plugins:{legend:{position:'top'}},scales:{y:{min:0,max:100,title:{display:true,text:'CPU %'},grid:{color:'#e8f1f5'}},x:{ticks:{maxRotation:45,font:{size:9}},grid:{color:'#e8f1f5'}}}}});
  return new Promise(resolve=>{
    requestAnimationFrame(()=>{canvas.toBlob(blob=>{
      if(!blob){chart.destroy();resolve(null);return}
      const reader=new FileReader();
      reader.onload=e=>{chart.destroy();resolve(new Uint8Array(e.target.result))};
      reader.onerror=()=>{chart.destroy();resolve(null)};
      reader.readAsArrayBuffer(blob);
    },'image/png')});
  });
}
